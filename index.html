, "Jacob", "Judah", "Benjamin"], "a": "Joseph", "ref": "Genesis 50:26"}, {"id": "be04", "cat": "Book Endings", "d": 2, "q": "Malachi ends by promising the coming of whom?", "choices": ["Elijah", "David", "Moses", "Enoch"], "a": "Elijah", "ref": "Malachi 4:5"}, {"id": "be05", "cat": "Book Endings", "d": 2, "q": "Jonah ends with the prophet still upset about what?", "choices": ["A plant and Nineveh's mercy", "A storm", "A king", "A fish"], "a": "A plant and Nineveh's mercy", "ref": "Jonah 4:6-11"}, {"id": "be06", "cat": "Book Endings", "d": 2, "q": "Acts ends with Paul in Rome, preaching with all boldness and without what?", "choices": ["Hindrance", "Friends", "Food", "A guard"], "a": "Hindrance", "ref": "Acts 28:31"}, {"id": "be07", "cat": "Book Endings", "d": 3, "q": "Judges ends by saying there was no king and everyone did what?", "choices": ["What was right in his own eyes", "What the priests said", "What the elders said", "What the law said"], "a": "What was right in his own eyes", "ref": "Judges 21:25"}, {"id": "be08", "cat": "Book Endings", "d": 3, "q": "Ruth ends with a genealogy leading to whom?", "choices": ["David", "Moses", "Saul", "Solomon"], "a": "David", "ref": "Ruth 4:17-22"}, {"id": "be09", "cat": "Book Endings", "d": 3, "q": "Job ends with Job restored and praying for his what?", "choices": ["Friends", "Flocks", "Children", "City"], "a": "Friends", "ref": "Job 42:10"}, {"id": "be10", "cat": "Book Endings", "d": 4, "q": "Ecclesiastes ends by saying the conclusion is to fear God and keep his what?", "choices": ["Commandments", "Feasts", "Vows", "Songs"], "a": "Commandments", "ref": "Ecclesiastes 12:13"}, {"id": "be11", "cat": "Book Endings", "d": 4, "q": "Lamentations ends with a prayer that the Lord would do what unless he has utterly rejected them?", "choices": ["Restore", "Judge", "Hide", "Wait"], "a": "Restore", "ref": "Lamentations 5:21-22"}, {"id": "be12", "cat": "Book Endings", "d": 4, "q": "2 Chronicles ends with Cyrus announcing a return to build what?", "choices": ["The temple", "The walls", "The palace", "The ark"], "a": "The temple", "ref": "2 Chronicles 36:23"}, {"id": "qr01", "cat": "Quick Recall", "d": 1, "q": "How many books are in the Protestant Bible?", "choices": ["66", "73", "39", "27"], "a": "66", "ref": "The canon"}, {"id": "qr02", "cat": "Quick Recall", "d": 1, "q": "How many days and nights was Jesus in the wilderness?", "choices": ["Forty", "Seven", "Twelve", "Three"], "a": "Forty", "ref": "Matthew 4:2"}, {"id": "qr03", "cat": "Quick Recall", "d": 1, "q": "How many loaves did Jesus use to feed five thousand, besides fish?", "choices": ["Five", "Seven", "Two", "Twelve"], "a": "Five", "ref": "Matthew 14:17"}, {"id": "qr04", "cat": "Quick Recall", "d": 2, "q": "How many baskets of leftovers were collected after the five thousand?", "choices": ["Twelve", "Seven", "Five", "Forty"], "a": "Twelve", "ref": "Matthew 14:20"}, {"id": "qr05", "cat": "Quick Recall", "d": 2, "q": "How many days did Jesus appear after the resurrection before ascending?", "choices": ["Forty", "Fifty", "Seven", "Three"], "a": "Forty", "ref": "Acts 1:3"}, {"id": "qr06", "cat": "Quick Recall", "d": 2, "q": "The fruit of the Spirit in Galatians lists how many qualities?", "choices": ["Nine", "Seven", "Twelve", "Three"], "a": "Nine", "ref": "Galatians 5:22-23"}, {"id": "qr07", "cat": "Quick Recall", "d": 3, "q": "How many plagues did God send on Egypt?", "choices": ["Ten", "Seven", "Twelve", "Three"], "a": "Ten", "ref": "Exodus 7-12"}, {"id": "qr08", "cat": "Quick Recall", "d": 3, "q": "How many tribes of Israel received land, with Levi set apart?", "choices": ["Twelve", "Ten", "Eleven", "Thirteen"], "a": "Twelve", "ref": "Joshua 13-19"}, {"id": "qr09", "cat": "Quick Recall", "d": 3, "q": "Jesus sent out the disciples in pairs. In Luke, a later sending numbered how many?", "choices": ["Seventy-two", "Twelve", "Forty", "Seven"], "a": "Seventy-two", "ref": "Luke 10:1"}, {"id": "qr10", "cat": "Quick Recall", "d": 4, "q": "How many chapters are in the book of Psalms?", "choices": ["150", "119", "66", "100"], "a": "150", "ref": "Psalm 150"}, {"id": "qr11", "cat": "Quick Recall", "d": 4, "q": "The longest chapter in the Bible is which psalm?", "choices": ["Psalm 119", "Psalm 23", "Psalm 51", "Psalm 150"], "a": "Psalm 119", "ref": "Psalm 119"}, {"id": "qr12", "cat": "Quick Recall", "d": 4, "q": "How many 'I am' sayings of Jesus are commonly counted in John?", "choices": ["Seven", "Three", "Twelve", "Ten"], "a": "Seven", "ref": "John 6-15"}]</script>
<script>
const BANK = JSON.parse(document.getElementById('bank').textContent);
const CATS = [...new Set(BANK.map(q => q.cat))];
const DONATE_URL = 'https://paypal.me/ScriptureShowdown';
const COLORS = ['#f0c36a', '#2fbfa8', '#ef6a52', '#7aa2ff', '#d57bff', '#e7f07a'];
const NAMES = ['Lions', 'Scrolls', 'Trumpets', 'Olives', 'Cedars', 'Lambs'];
const BUZZ_KEYS = ['1', 'Z', 'V', 'M', '/', '='];
const LEVELS = [
  { id: 'climb', label: 'Full climb' },
  { id: 1, label: 'Easy' },
  { id: 2, label: 'Medium' },
  { id: 3, label: 'Hard' },
  { id: 4, label: 'Extreme' }
];
const state = {
  view: 'home',
  level: 'climb',
  mode: 'board',
  teams: [],
  turn: 0,
  used: new Set(JSON.parse(sessionStorage.getItem('ss-used') || '[]')),
  sound: localStorage.getItem('ss-sound') !== 'off',
  board: null,
  clue: null,
  lock: false,
  timer: null,
  lightning: null,
  lastCats: []
};
try {
  const savedNames = JSON.parse(localStorage.getItem('ss-teams') || '[]');
  const savedCount = Number(localStorage.getItem('ss-team-count') || 0);
  if (Array.isArray(savedNames) && savedNames.length) {
    state.teams = savedNames.slice(0, 6).map((name, i) => ({ name, color: COLORS[i], score: 0, lives: 3, wager: 0, finalPick: '' }));
    state.teamCount = savedCount || savedNames.length;
  }
} catch (e) {}

function saveUsed() { sessionStorage.setItem('ss-used', JSON.stringify([...state.used])); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function levelLabel() { return LEVELS.find(l => l.id === state.level).label; }
function allowed(q) { return state.level === 'climb' || q.d === state.level; }
function remaining() { return BANK.filter(q => allowed(q) && !state.used.has(q.id)).length; }
function poolSize() { return BANK.filter(allowed).length; }
function clearTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function tone(freq, dur, type, gain) {
  if (!state.sound) return;
  try {
    const ctx = state.ctx || (state.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = gain || 0.05;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur);
  } catch (e) {}
}
function fanfare() { tone(523, .12); setTimeout(() => tone(659, .12), 90); setTimeout(() => tone(784, .22), 180); }
function miss() { tone(180, .22, 'square', .04); }

function pickQuestion(cat, diff) {
  const base = BANK.filter(q => !state.used.has(q.id) && allowed(q));
  let pool = base.filter(q => q.cat === cat && (state.level !== 'climb' || q.d === diff));
  if (!pool.length) pool = base.filter(q => q.cat === cat);
  if (!pool.length) pool = base.filter(q => state.level === 'climb' ? q.d === diff : true);
  if (!pool.length) {
    state.used.clear();
    saveUsed();
    toast('Question scroll recycled. Fresh pass.');
    return pickQuestion(cat, diff);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildBoard() {
  const diffs = [1, 1, 2, 3, 4];
  const ranked = shuffle(CATS).map(cat => ({
    cat,
    n: BANK.filter(q => q.cat === cat && !state.used.has(q.id) && allowed(q)).length
  })).sort((a, b) => b.n - a.n);
  let chosen = ranked.filter(c => !state.lastCats.includes(c.cat) && c.n > 0).slice(0, 6).map(c => c.cat);
  if (chosen.length < 6) chosen = ranked.filter(c => c.n > 0).slice(0, 6).map(c => c.cat);
  if (chosen.length < 6) chosen = shuffle(CATS).slice(0, 6);
  state.lastCats = chosen.slice();
  const values = [100, 200, 300, 400, 500];
  const cells = [];
  chosen.forEach((cat, col) => {
    values.forEach((value, row) => {
      const q = pickQuestion(cat, diffs[row]);
      state.used.add(q.id);
      cells.push({ col, row, value, q, used: false, dd: false });
    });
  });
  saveUsed();
  const open = cells.filter(c => c.value >= 300);
  shuffle(open).slice(0, 2).forEach(c => c.dd = true);
  state.board = { cats: chosen, cells };
  state.turn = 0;
}

function currentTeam() { return state.teams[state.turn]; }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = template();
  bind();
}

function brand() {
  return `<button class="brand" data-act="home"><div class="mark">SS</div><div><b>Scripture Showdown</b><span>${esc(levelLabel())} · ${remaining()} fresh</span></div></button>`;
}

function template() {
  if (state.view === 'privacy') return privacyHTML();
  if (state.view === 'donate') return donateHTML();
  if (state.view === 'home') return homeHTML();
  if (state.view === 'setup') return setupHTML();
  if (state.view === 'board') return boardHTML();
  if (state.view === 'clue' || state.view === 'resolve' || state.view === 'steal' || state.view === 'wager') return clueHTML();
  if (state.view === 'final-wager' || state.view === 'final-answer' || state.view === 'final-reveal') return finalHTML();
  if (state.view === 'lightning') return lightningHTML();
  if (state.view === 'streak') return streakHTML();
  if (state.view === 'buzzer') return buzzerHTML();
  if (state.view === 'winner') return winnerHTML();
  return homeHTML();
}


function privacyHTML() {
  return `<div class="wrap"><div class="topbar">${brand()}<button class="ghost" data-act="home">Back</button></div>
    <div class="panel"><p class="kicker">Version 1.0.0</p><h2>Privacy policy</h2>
    <p class="sub">Scripture Showdown does not create accounts, collect names, track you, show ads, or sell data. Team names and scores stay on this device for the game in front of you. Used-question memory is stored in this app only and can be cleared with Recycle question bank.</p>
    <p class="sub">The question bank is included in the app. A reference after each answer is for the group in the room, not sent anywhere.</p>
    <p class="sub">Support: info@getshowdown.com</p>
    <button class="primary" data-act="home">Back to modes</button></div></div>`;
}

function donateHTML() {
  const link = DONATE_URL
    ? `<a class="primary" href="${esc(DONATE_URL)}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Give</a>`
    : `<p class="sub">Giving opens on the payment page, not inside the game.</p>`;
  return `<div class="wrap"><div class="topbar">${brand()}<button class="ghost" data-act="home">Back</button></div>
    <div class="panel"><p class="kicker">Free, and staying that way</p><h2>Keep the scroll open.</h2>
    <p class="sub">Scripture Showdown is free to download and free to play. No ads. No accounts. No paywall on the questions.</p>
    <p class="sub">A gift helps cover the store fees and keeps the next youth night from hitting a paywall. Giving happens on the payment page, not inside the game. This app still does not collect names or payment details.</p>
    ${link}
    <div class="row-actions"><button class="ghost" data-act="home">Back to modes</button></div></div></div>`;
}

function homeHTML() {
  const pct = Math.round((remaining() / poolSize()) * 100);
  return `<div class="wrap">
    <div class="topbar">${brand()}<button class="icon-btn" data-act="sound">${state.sound ? 'Sound on' : 'Sound off'}</button></div>
    <section class="hero">
      <p class="kicker">Group Bible quiz · one screen</p>
      <h1>Make the scroll<br><em>fight back.</em></h1>
      <p class="lede">Four ways to play, four knowledge bands, and ${BANK.length} questions across ${CATS.length} categories. Boards reshuffle. Used clues stay benched until the bank runs dry.</p>
      <p class="phone-note">On a phone: open this page in Safari or Chrome, then use the share menu and choose Add to Home Screen. That only works from a link, not from a file saved in the Files app.</p>
      <div class="levels">${LEVELS.map(l => `<button class="chip ${l.id === state.level ? 'on' : ''}" data-act="level" data-level="${l.id}">${l.label}</button>`).join('')}</div>
      <div class="modes">
        <button class="mode" data-act="pick" data-mode="board"><span class="tag">Main event</span><h2>The Board</h2><p>Jeopardy-style. Six random categories, values that climb, two Daily Doubles, and a Final Scroll.</p><span class="go">Set teams →</span></button>
        <button class="mode" data-act="pick" data-mode="buzzer"><span class="tag">Around the table</span><h2>Buzzer Battle</h2><p>Question hits. First team to slam their button answers. Miss, and the others steal.</p><span class="go">Set teams →</span></button>
        <button class="mode" data-act="pick" data-mode="lightning"><span class="tag">60 seconds</span><h2>Lightning Blitz</h2><p>Hot seat. Combos stack. Wrong answers burn the clock. Built for bragging rights.</p><span class="go">Set teams →</span></button>
        <button class="mode" data-act="pick" data-mode="streak"><span class="tag">Elimination</span><h2>Last Scroll Standing</h2><p>Three lives each. Miss and a life drops. Difficulty climbs until one team is left.</p><span class="go">Set teams →</span></button>
      </div>
      <div class="fresh"><span>Fresh questions in this band</span><span>${remaining()} / ${poolSize()}</span></div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="help">
        <div><b>How a night runs</b> Put a laptop or tablet where everyone can see it. Pick a band, pick a mode, name the teams.</div>
        <div><b>Full climb</b> Easy clues at 100–200, medium at 300, hard at 400, extreme at 500. A single band keeps every clue in that lane.</div>
        <div><b>No repeats</b> Answered questions are parked for the session. Resetting the board pulls new categories first.</div>
        <div><b>Keys</b> Answers are 1–4. In Buzzer Battle, six teams slam 1 Z V M / =.</div>
        <div><b>Privacy</b> No account, no tracking, no ads. Questions stay on this device. <button class="ghost" data-act="privacy" style="margin-top:8px">Privacy policy</button></div>
        <div><b>Keep it free</b> No ads, no charge. A gift helps cover the store fees. <button class="ghost" data-act="donate" style="margin-top:8px">Donation page</button></div>
      </div>
    </section>
  </div>`;
}

function setupHTML() {
  const n = state.teamCount || (state.mode === 'lightning' ? 1 : 2);
  state.teamCount = n;
  return `<div class="wrap"><div class="topbar">${brand()}</div>
    <div class="panel">
      <p class="kicker">${esc(state.mode)}</p>
      <h2>Name the teams</h2>
      <p class="sub">Up to 6 teams. ${state.mode === 'board' ? 'Control passes when a team misses. Daily Doubles can wager up to their score, or 500 if they are behind.' : 'Buzzer keys are 1 Z V M / =, spread across the keyboard.'}</p>
      <div class="row-actions" style="margin-top:0;margin-bottom:14px">
        ${[1,2,3,4,5,6].map(i => `<button class="chip ${n===i?'on':''}" data-act="count" data-n="${i}">${i} ${i===1?'player':'teams'}</button>`).join('')}
      </div>
      <div class="team-grid">
        ${Array.from({length: n}, (_, i) => `<label class="team-row"><i class="swatch" style="background:${COLORS[i]}"></i><input data-team="${i}" value="${esc((state.teams[i] && state.teams[i].name) || NAMES[i])}" /></label>`).join('')}
      </div>
      <div class="row-actions">
        <button class="primary" data-act="start">Start ${esc(modeName())}</button>
        <button class="ghost" data-act="home">Back</button>
      </div>
    </div>
  </div>`;
}

function modeName() {
  return { board: 'the board', buzzer: 'buzzer battle', lightning: 'lightning', streak: 'last scroll standing' }[state.mode];
}

function bugs() {
  return `<div class="scorebug">${state.teams.map((t, i) => `<div class="bug ${i===state.turn?'on':''}"><div class="nm"><i class="dot" style="background:${t.color}"></i>${esc(t.name)}</div><div class="sc">${t.score}</div>${state.mode==='streak'?`<div class="lives">${[0,1,2].map(n => `<i class="pip ${n<t.lives?'':'off'}"></i>`).join('')}</div>`:''}</div>`).join('')}</div>`;
}

function boardHTML() {
  const b = state.board;
  const cats = b.cats.map(c => `<div class="cat">${esc(c)}</div>`).join('');
  let cells = '';
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 6; col++) {
      const cell = b.cells.find(c => c.row === row && c.col === col);
      cells += `<button class="cell" data-act="cell" data-id="${cell.q.id}" ${cell.used?'disabled':''}>${cell.used?'':cell.value}</button>`;
    }
  }
  const left = b.cells.filter(c => !c.used).length;
  return `<div class="wrap stage"><div class="topbar">${brand()}<div style="display:flex;gap:8px"><button class="ghost" data-act="reset-board">New board</button><button class="ghost" data-act="call-final">Final Scroll</button></div></div>${bugs()}<p class="overlay-note">${esc(currentTeam().name)} picks · ${left} clues left</p><div class="board-wrap"><div class="board">${cats}${cells}</div></div></div>`;
}

function clueHTML() {
  const c = state.clue;
  const q = c.q;
  const header = `<div class="topbar">${brand()}<button class="ghost" data-act="abandon">Back to board</button></div>${bugs()}`;
  if (state.view === 'wager') {
    return `<div class="wrap stage">${header}<div class="clue"><div class="meta">Daily Double · ${esc(q.cat)}</div><h2>${esc(currentTeam().name)}, set your wager.</h2><p>Max ${c.max}. The clue stays hidden.</p></div><div class="row-actions"><input id="wager" type="number" min="0" max="${c.max}" value="${Math.min(c.max, c.value)}" /><button class="primary" data-act="lock-wager">Show the clue</button></div></div>`;
  }
  const choices = c.order.map((choice, i) => {
    let cls = 'choice';
    if (state.view === 'resolve') {
      if (choice === q.a && !c.offerSteal) cls += ' good';
      else if (choice === c.picked) cls += ' bad';
    }
    return `<button class="${cls}" data-act="answer" data-i="${i}" ${state.view==='clue'?'':'disabled'}>${i+1}. ${esc(choice)}</button>`;
  }).join('');
  const foot = state.view === 'resolve'
    ? `<p class="ref">${c.offerSteal ? 'Miss. Steal before the answer is shown.' : ((c.correct ? 'Correct. ' : 'Answer: ' + esc(q.a) + '. ') + esc(q.ref))}</p><div class="row-actions">${c.offerSteal ? '<button class="primary" data-act="open-steal">Open a steal</button>' : ''}<button class="primary" data-act="continue">${c.offerSteal ? 'No steal' : 'Continue'}</button></div>`
    : '';
  const steal = state.view === 'steal' ? `<div class="row-actions">${state.teams.map((t,i)=> i===c.owner ? '' : `<button class="ghost" data-act="steal-team" data-i="${i}">${esc(t.name)} steals</button>`).join('')}<button class="ghost" data-act="continue">Nobody</button></div>` : '';
  return `<div class="wrap stage">${header}<div class="clue"><div class="meta">${esc(q.cat)} · ${c.wager || c.value}${c.dd ? ' · Daily Double' : ''}</div><h2>${esc(q.q)}</h2></div>${state.view==='steal'?steal:`<div class="choices">${choices}</div>`}${foot}</div>`;
}

function finalHTML() {
  const f = state.final;
  if (state.view === 'final-wager') {
    const t = state.teams[f.step];
    return `<div class="wrap stage"><div class="topbar">${brand()}</div><div class="clue"><div class="meta">Final Scroll · pass the device</div><h2>${esc(t.name)}, wager in secret.</h2><p>Category: ${esc(f.q.cat)}. Max ${t.score}. Others look away.</p></div><input id="wager" type="number" min="0" max="${t.score}" value="0" /><div class="row-actions"><button class="primary" data-act="final-wager">Lock wager</button></div></div>`;
  }
  if (state.view === 'final-answer') {
    const t = state.teams[f.step];
    return `<div class="wrap stage"><div class="topbar">${brand()}</div><div class="clue"><div class="meta">${esc(f.q.cat)} · ${esc(t.name)} only</div><h2>${esc(f.q.q)}</h2></div><div class="choices">${f.order.map((choice,i)=>`<button class="choice" data-act="final-pick" data-i="${i}">${esc(choice)}</button>`).join('')}</div></div>`;
  }
  const rows = state.teams.map(t => `<div class="bug"><div class="nm">${esc(t.name)}</div><div class="sc">${t.score}</div><p class="overlay-note">${esc(t.finalPick)} · wager ${t.wager} · ${t.finalPick===f.q.a?'right':'wrong'}</p></div>`).join('');
  return `<div class="wrap stage"><div class="topbar">${brand()}</div><div class="clue"><div class="meta">Final Scroll</div><h2>${esc(f.q.a)}</h2><p>${esc(f.q.ref)}</p></div><div class="scorebug">${rows}</div><div class="row-actions"><button class="primary" data-act="winner">See the winner</button></div></div>`;
}

function lightningHTML() {
  const L = state.lightning;
  const q = L.q;
  return `<div class="wrap stage"><div class="topbar">${brand()}<button class="ghost" data-act="end-mode">End</button></div>${bugs()}<div class="timer"><i style="transform:scaleX(${Math.max(0, L.left/60)})"></i></div><p class="overlay-note">${L.left.toFixed(0)}s · combo x${L.combo} · ${esc(state.teams[L.hot].name)}</p><div class="clue"><div class="meta">${esc(q.cat)} · band ${q.d}</div><h2>${esc(q.q)}</h2></div><div class="choices">${L.order.map((choice,i)=>`<button class="choice" data-act="zap" data-i="${i}">${i+1}. ${esc(choice)}</button>`).join('')}</div></div>`;
}

function streakHTML() {
  const S = state.streak;
  const q = S.q;
  return `<div class="wrap stage"><div class="topbar">${brand()}</div>${bugs()}<p class="overlay-note">${esc(currentTeam().name)} · band ${q.d}</p><div class="clue"><div class="meta">${esc(q.cat)}</div><h2>${esc(q.q)}</h2></div><div class="choices">${S.order.map((choice,i)=>`<button class="choice" data-act="streak-pick" data-i="${i}" ${S.lock?'disabled':''}>${esc(choice)}</button>`).join('')}</div>${S.note?`<p class="ref">${esc(S.note)}</p><button class="primary" data-act="streak-next">Next</button>`:''}</div>`;
}

function buzzerHTML() {
  const B = state.buzzer;
  const q = B.q;
  const choices = B.buzzed == null ? '' : `<div class="choices">${B.order.map((choice,i)=>`<button class="choice" data-act="buzz-answer" data-i="${i}" ${B.lock?'disabled':''}>${esc(choice)}</button>`).join('')}</div>`;
  const pads = `<div class="buzzers">${state.teams.map((t,i)=>`<button class="buzz" style="background:${t.color}" data-act="buzz" data-i="${i}" ${B.locked.has(i)||B.buzzed!=null?'disabled':''}>${esc(t.name)}<small>KEY ${BUZZ_KEYS[i]}</small></button>`).join('')}</div>`;
  return `<div class="wrap stage"><div class="topbar">${brand()}<button class="ghost" data-act="end-mode">End round</button></div>${bugs()}<div class="clue"><div class="meta">${esc(q.cat)} · ${[100,200,300,400][q.d-1]} pts</div><h2>${esc(q.q)}</h2><p>${B.buzzed==null?'Slam in. First tap answers.':'Answering: '+esc(state.teams[B.buzzed].name)}</p></div>${B.buzzed==null?pads:choices}${B.note?`<p class="ref">${esc(B.note)}</p><button class="primary" data-act="buzz-next">Next clue</button>`:''}</div>`;
}

function winnerHTML() {
  const ranked = state.teams.slice().sort((a,b)=>b.score-a.score);
  const top = ranked[0];
  const tie = ranked.filter(t => t.score === top.score);
  return `<div class="wrap"><div class="topbar">${brand()}</div><div class="winner"><p class="kicker">Showdown complete</p><h2>${tie.length>1?'Split decision':esc(top.name)}</h2><p class="lede" style="margin-inline:auto">${tie.length>1?tie.map(t=>esc(t.name)).join(' & ')+' tie at '+top.score+'.':esc(top.name)+' finishes at '+top.score+'.'}</p></div>${bugs()}<div class="row-actions" style="justify-content:center"><button class="primary" data-act="again">Play again</button><button class="ghost" data-act="home">Modes</button><button class="ghost" data-act="donate">Keep it free</button><button class="ghost" data-act="recycle">Recycle question bank</button></div></div>`;
}

function bind() {
  document.getElementById('app').onclick = (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    act(btn.dataset.act, btn);
  };
}

function act(name, btn) {
  if (name === 'sound') {
    state.sound = !state.sound;
    localStorage.setItem('ss-sound', state.sound ? 'on' : 'off');
    render(); return;
  }
  if (name === 'privacy') { state.view = 'privacy'; render(); return; }
  if (name === 'donate') { state.view = 'donate'; render(); return; }
  if (name === 'home') { clearTimer(); state.view = 'home'; render(); return; }
  if (name === 'level') { state.level = btn.dataset.level === 'climb' ? 'climb' : Number(btn.dataset.level); render(); return; }
  if (name === 'pick') { state.mode = btn.dataset.mode; state.view = 'setup'; state.teamCount = state.mode === 'lightning' ? 1 : 2; render(); return; }
  if (name === 'count') { state.teamCount = Number(btn.dataset.n); captureNames(); render(); return; }
  if (name === 'start') { startMode(); return; }
  if (name === 'cell') { openCell(btn.dataset.id); return; }
  if (name === 'lock-wager') { lockWager(); return; }
  if (name === 'answer') { judge(Number(btn.dataset.i)); return; }
  if (name === 'open-steal') { state.view = 'steal'; render(); return; }
  if (name === 'steal-team') { beginSteal(Number(btn.dataset.i)); return; }
  if (name === 'continue') { afterClue(); return; }
  if (name === 'abandon') { state.view = 'board'; render(); return; }
  if (name === 'reset-board') { buildBoard(); state.view = 'board'; render(); toast('New categories locked in.'); return; }
  if (name === 'call-final') { startFinal(); return; }
  if (name === 'final-wager') { saveFinalWager(); return; }
  if (name === 'final-pick') { saveFinalPick(Number(btn.dataset.i)); return; }
  if (name === 'winner') { state.view = 'winner'; render(); fanfare(); return; }
  if (name === 'zap') { zap(Number(btn.dataset.i)); return; }
  if (name === 'streak-pick') { streakPick(Number(btn.dataset.i)); return; }
  if (name === 'streak-next') { streakNext(); return; }
  if (name === 'buzz') { buzz(Number(btn.dataset.i)); return; }
  if (name === 'buzz-answer') { buzzAnswer(Number(btn.dataset.i)); return; }
  if (name === 'buzz-next') { nextBuzz(); return; }
  if (name === 'end-mode') { clearTimer(); state.view = 'winner'; render(); return; }
  if (name === 'again') { startMode(); return; }
  if (name === 'recycle') { state.used.clear(); saveUsed(); toast('Bank recycled.'); render(); return; }
}

function captureNames() {
  document.querySelectorAll('[data-team]').forEach(input => {
    state.teams[Number(input.dataset.team)] = state.teams[Number(input.dataset.team)] || {};
    state.teams[Number(input.dataset.team)].name = input.value;
  });
}

function startMode() {
  captureNames();
  const previous = state.teams.slice();
  const n = state.teamCount || previous.length || 2;
  state.teams = Array.from({length: n}, (_, i) => ({
    name: (document.querySelector(`[data-team="${i}"]`) || {}).value || (previous[i] && previous[i].name) || NAMES[i],
    color: COLORS[i], score: 0, lives: 3, wager: 0, finalPick: ''
  }));
  localStorage.setItem('ss-teams', JSON.stringify(state.teams.map(t => t.name)));
  localStorage.setItem('ss-team-count', String(n));
  if (state.mode === 'board') { buildBoard(); state.view = 'board'; }
  if (state.mode === 'lightning') startLightning();
  if (state.mode === 'streak') startStreak();
  if (state.mode === 'buzzer') nextBuzz();
  render();
}

function openCell(id) {
  const cell = state.board.cells.find(c => c.q.id === id && !c.used);
  if (!cell) return;
  cell.used = true;
  const max = Math.max(currentTeam().score, 500);
  state.clue = { q: cell.q, value: cell.value, dd: cell.dd, order: shuffle(cell.q.choices), owner: state.turn, picked: null, correct: false, offerSteal: false, wager: cell.value, max };
  tone(440, .08);
  if (cell.dd) { state.view = 'wager'; render(); return; }
  state.view = 'clue'; render();
}
function lockWager() {
  const raw = Number(document.getElementById('wager').value || 0);
  state.clue.wager = Math.max(0, Math.min(state.clue.max, raw));
  state.view = 'clue'; render();
}
function judge(i) {
  if (state.lock || state.view !== 'clue') return;
  state.lock = true;
  const c = state.clue;
  c.picked = c.order[i];
  c.correct = c.picked === c.q.a;
  const pts = c.wager || c.value;
  if (c.correct) { currentTeam().score += pts; fanfare(); c.offerSteal = false; }
  else { if (c.dd) currentTeam().score -= pts; miss(); c.offerSteal = state.teams.length > 1 && !c.dd && !c.stolen; }
  state.view = 'resolve'; state.lock = false; render();
}
function beginSteal(i) {
  state.turn = i;
  state.clue.dd = false;
  state.clue.offerSteal = false;
  state.clue.stolen = true;
  state.clue.owner = i;
  state.clue.picked = null;
  state.clue.order = shuffle(state.clue.q.choices);
  state.view = 'clue';
  render();
}
function afterClue() {
  if (!state.clue.correct) {
    if (state.clue.stolen && state.teams.length > 1) {
      const options = state.teams.map((_, i) => i).filter(i => i !== state.clue.owner);
      state.turn = options[Math.floor(Math.random() * options.length)];
    } else {
      state.turn = (state.clue.owner + 1) % state.teams.length;
    }
  }
  const left = state.board.cells.filter(c => !c.used).length;
  if (!left) { startFinal(); return; }
  state.view = 'board'; render();
}
function startFinal() {
  const q = pickQuestion(shuffle(CATS)[0], 4);
  state.used.add(q.id); saveUsed();
  state.final = { q, order: shuffle(q.choices), step: 0, phase: 'wager' };
  state.teams.forEach(t => { t.wager = 0; t.finalPick = ''; });
  state.view = 'final-wager'; render();
}
function saveFinalWager() {
  const t = state.teams[state.final.step];
  t.wager = Math.max(0, Math.min(t.score, Number(document.getElementById('wager').value || 0)));
  state.final.step += 1;
  if (state.final.step >= state.teams.length) { state.final.step = 0; state.view = 'final-answer'; }
  render();
}
function saveFinalPick(i) {
  const f = state.final;
  const t = state.teams[f.step];
  t.finalPick = f.order[i];
  f.step += 1;
  if (f.step >= state.teams.length) {
    state.teams.forEach(team => { team.score += team.finalPick === f.q.a ? team.wager : -team.wager; });
    state.view = 'final-reveal';
  }
  render();
}

function deal(diff) {
  const q = pickQuestion(shuffle(CATS)[0], diff || (state.level === 'climb' ? 1 + Math.floor(Math.random()*4) : state.level));
  state.used.add(q.id); saveUsed();
  return { q, order: shuffle(q.choices) };
}
function startLightning() {
  const dealt = deal();
  state.lightning = { hot: 0, left: 60, combo: 1, q: dealt.q, order: dealt.order };
  state.view = 'lightning';
  clearTimer();
  state.timer = setInterval(() => {
    state.lightning.left -= 0.2;
    if (state.lightning.left <= 0) { clearTimer(); state.view = 'winner'; fanfare(); render(); return; }
    const bar = document.querySelector('.timer > i');
    const label = document.querySelector('.overlay-note');
    if (bar) bar.style.transform = `scaleX(${Math.max(0, state.lightning.left/60)})`;
    if (label) label.textContent = `${state.lightning.left.toFixed(0)}s · combo x${state.lightning.combo} · ${state.teams[state.lightning.hot].name}`;
  }, 200);
}
function zap(i) {
  const L = state.lightning;
  const right = L.order[i] === L.q.a;
  if (right) { state.teams[L.hot].score += 100 * L.combo; L.combo = Math.min(5, L.combo + 1); tone(700, .08); }
  else { L.combo = 1; L.left = Math.max(0, L.left - 3); miss(); }
  L.hot = (L.hot + 1) % state.teams.length;
  const dealt = deal();
  L.q = dealt.q; L.order = dealt.order;
  render();
}
function startStreak() {
  state.turn = 0;
  const dealt = deal(1);
  state.streak = { q: dealt.q, order: dealt.order, lock: false, note: '', clears: 0 };
  state.view = 'streak';
}
function streakPick(i) {
  const S = state.streak;
  if (S.lock) return;
  S.lock = true;
  const right = S.order[i] === S.q.a;
  if (right) {
    currentTeam().score += 100 * S.q.d;
    S.clears += 1;
    S.note = `Correct. ${S.q.ref}`;
    fanfare();
  } else {
    currentTeam().lives -= 1;
    S.note = `Miss. Answer: ${S.q.a}. ${S.q.ref}`;
    miss();
  }
  render();
  const alive = state.teams.filter(t => t.lives > 0);
  if (alive.length <= 1) setTimeout(() => { state.view = 'winner'; render(); fanfare(); }, 700);
}
function streakNext() {
  const aliveIdx = state.teams.map((t,i)=>t.lives>0?i:-1).filter(i=>i>=0);
  if (aliveIdx.length <= 1) { state.view = 'winner'; render(); return; }
  let next = (state.turn + 1) % state.teams.length;
  while (state.teams[next].lives <= 0) next = (next + 1) % state.teams.length;
  state.turn = next;
  const band = state.level === 'climb' ? Math.min(4, 1 + Math.floor(state.streak.clears / 2)) : state.level;
  const dealt = deal(band);
  state.streak = { q: dealt.q, order: dealt.order, lock: false, note: '', clears: state.streak.clears };
  render();
}
function nextBuzz() {
  const dealt = deal(state.level === 'climb' ? 1 + Math.floor(Math.random()*4) : state.level);
  state.buzzer = { q: dealt.q, order: dealt.order, buzzed: null, locked: new Set(), lock: false, note: '' };
  state.view = 'buzzer';
  render();
}
function buzz(i) {
  if (state.buzzer.buzzed != null || state.buzzer.locked.has(i)) return;
  state.buzzer.buzzed = i;
  state.turn = i;
  tone(520, .07);
  render();
}
function buzzAnswer(i) {
  const B = state.buzzer;
  if (B.lock) return;
  B.lock = true;
  const right = B.order[i] === B.q.a;
  const pts = [100,200,300,400][B.q.d-1];
  if (right) {
    state.teams[B.buzzed].score += pts;
    B.note = `Locked in. ${B.q.ref}`;
    fanfare();
    render();
  } else {
    B.locked.add(B.buzzed);
    B.buzzed = null;
    B.lock = false;
    miss();
    if (B.locked.size >= state.teams.length) B.note = `Answer: ${B.q.a}. ${B.q.ref}`;
    render();
  }
}

window.addEventListener('keydown', (e) => {
  if (e.target.matches('input')) return;
  const buzzMap = { '1':0, z:1, v:2, m:3, '/':4, '=':5 };
  const buzzKey = e.key === '/' || e.key === '=' ? e.key : e.key.toLowerCase();
  if (state.view === 'buzzer' && state.buzzer && state.buzzer.buzzed == null && buzzMap[buzzKey] != null) {
    const btn = document.querySelector(`[data-act="buzz"][data-i="${buzzMap[buzzKey]}"]`);
    if (btn && !btn.disabled) btn.click();
    return;
  }
  const n = Number(e.key);
  if (n >= 1 && n <= 4) {
    const btn = document.querySelector(`[data-act="answer"][data-i="${n-1}"], [data-act="zap"][data-i="${n-1}"], [data-act="streak-pick"][data-i="${n-1}"], [data-act="buzz-answer"][data-i="${n-1}"]`);
    if (btn && !btn.disabled) btn.click();
  }
});

render();
</script>
</body>
</html>
