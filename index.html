<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12100e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Showdown" />
<title>Scripture Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,560;700;800&family=Outfit:wght@380;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #12100e;
    --bg-2: #1c1814;
    --ink: #16130f;
    --cream: #f4efe4;
    --cream-dim: #d9d0c0;
    --gold: #f0c36a;
    --gold-2: #c9843c;
    --teal: #2fbfa8;
    --coral: #ef6a52;
    --blue: #7aa2ff;
    --board: #141c2e;
    --tile: #1e2b46;
    --line: rgba(240,195,106,.28);
    --shadow: 0 24px 60px rgba(0,0,0,.35);
    --display: "Bricolage Grotesque", Georgia, serif;
    --sans: Outfit, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    color: var(--cream);
    background:
      radial-gradient(1000px 520px at 80% -10%, rgba(240,195,106,.16), transparent 55%),
      radial-gradient(800px 480px at -10% 110%, rgba(47,191,168,.12), transparent 50%),
      var(--bg);
    min-height: 100%;
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  #app { min-height: 100%; }
  .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0 8px; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; padding: 0; text-align: left; }
  .mark {
    width: 42px; height: 42px; border-radius: 13px;
    background: linear-gradient(160deg, var(--gold), #8a5a22);
    color: var(--ink); display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; letter-spacing: -0.04em;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
  }
  .brand b { display: block; font-family: var(--display); font-size: 18px; letter-spacing: -0.03em; }
  .brand span { display: block; color: var(--cream-dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .icon-btn, .ghost {
    background: rgba(255,255,255,.04);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: 10px 14px;
    font-weight: 600;
  }
  .icon-btn:hover, .ghost:hover { border-color: var(--line); }
  .hero { padding: 28px 0 18px; }
  .kicker {
    color: var(--gold); letter-spacing: .18em; text-transform: uppercase;
    font-size: 12px; font-weight: 700; margin: 0 0 10px;
  }
  h1 {
    font-family: var(--display); font-weight: 800; letter-spacing: -0.045em;
    font-size: clamp(42px, 7vw, 84px); line-height: .9; margin: 0 0 14px;
  }
  h1 em { font-style: normal; color: var(--gold); }
  .lede { max-width: 640px; color: var(--cream-dim); font-size: 18px; line-height: 1.45; margin: 0 0 22px; }
  .phone-note { max-width: 640px; color: var(--gold); font-size: 15px; line-height: 1.4; margin: -8px 0 22px; }
  .levels { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    color: var(--cream);
    border-radius: 999px;
    padding: 10px 14px;
    font-weight: 650;
  }
  .chip.on { background: var(--gold); color: var(--ink); border-color: transparent; }
  .modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .mode {
    text-align: left; color: var(--cream);
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px; padding: 20px 20px 18px;
    box-shadow: var(--shadow); min-height: 180px;
    display: flex; flex-direction: column; gap: 8px;
    transition: transform .18s ease, border-color .18s ease;
  }
  .mode:hover { transform: translateY(-3px); border-color: var(--line); }
  .mode .tag { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .mode h2 { font-family: var(--display); font-size: 30px; margin: 0; letter-spacing: -0.03em; }
  .mode p { margin: 0; color: var(--cream-dim); line-height: 1.4; }
  .mode .go { margin-top: auto; color: var(--gold); font-weight: 700; }
  .fresh {
    margin: 22px 0 30px; color: var(--cream-dim); font-size: 14px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .meter { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; width: min(280px, 100%); }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-2), var(--gold)); }
  .panel {
    width: min(980px, calc(100% - 32px)); margin: 28px auto 40px;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px; padding: 28px; box-shadow: var(--shadow);
  }
  .panel h2 { font-family: var(--display); font-size: 40px; margin: 0 0 8px; letter-spacing: -0.04em; }
  .sub { color: var(--cream-dim); margin: 0 0 18px; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .team-row { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: center; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; }
  input[type="text"], input[type="number"] {
    width: 100%; background: #0e0c0a; color: var(--cream);
    border: 1px solid rgba(255,255,255,.1); border-radius: 14px;
    padding: 14px 14px; font-size: 16px;
  }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .primary {
    background: var(--gold); color: var(--ink); border: 0; border-radius: 999px;
    padding: 14px 18px; font-weight: 800; letter-spacing: -0.02em; font-size: 16px;
  }
  .primary:hover { filter: brightness(1.05); }
  .scorebug {
    display: flex; gap: 8px; overflow: auto; padding-bottom: 8px;
  }
  .bug {
    min-width: 112px; background: #201c17; border-radius: 16px; padding: 10px 12px; flex: 1;
    border: 1px solid rgba(255,255,255,.06); position: relative;
  }
  .bug.on { outline: 2px solid var(--gold); }
  .bug .nm { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .bug .sc { font-family: var(--display); font-size: 28px; letter-spacing: -0.04em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .board-wrap { overflow: auto; padding-bottom: 20px; }
  .board {
    display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr));
    gap: 8px; min-width: 860px;
  }
  .cat, .cell {
    border-radius: 14px; border: 0; color: var(--cream);
  }
  .cat {
    background: #2a2118; min-height: 84px; padding: 10px;
    font-family: var(--display); font-weight: 800; letter-spacing: -0.03em;
    font-size: 16px; line-height: 1.1;
    box-shadow: inset 0 -3px 0 var(--gold-2);
  }
  .cell {
    background: linear-gradient(180deg, #243656, #1a2742);
    min-height: 72px; font-family: var(--display); font-size: 28px;
    color: var(--gold); letter-spacing: -0.04em;
    box-shadow: inset 0 0 0 1px rgba(240,195,106,.18);
  }
  .cell:hover:not(:disabled) { filter: brightness(1.12); }
  .cell:disabled { color: transparent; background: #121820; box-shadow: none; }
    .stage {
    min-height: calc(100vh - 40px);
    display: flex; flex-direction: column; gap: 16px; padding-bottom: 28px;
  }
  .clue {
    margin-top: 8px; background: #f4efe4; color: #1a140f;
    border-radius: 28px; padding: clamp(22px, 4vw, 42px);
    min-height: 280px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: center;
  }
  .clue .meta { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; font-weight: 800; color: #8a5a22; }
  .clue h2 { font-family: var(--display); font-size: clamp(28px, 4vw, 46px); letter-spacing: -0.04em; margin: 10px 0 0; line-height: 1.05; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    text-align: left; background: #241f1a; color: var(--cream);
    border: 1px solid rgba(255,255,255,.06); border-radius: 16px;
    padding: 16px 16px; font-size: 17px; font-weight: 650; min-height: 72px;
  }
  .choice:hover:not(:disabled) { border-color: var(--gold); }
  .choice.good { background: #174940; border-color: var(--teal); }
  .choice.bad { background: #5a2a24; border-color: var(--coral); }
  .choice:disabled { cursor: default; }
  .ref { color: var(--cream-dim); font-size: 14px; }
  .timer {
    height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden;
  }
  .timer > i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left center; }
  .buzzers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .buzz {
    border: 0; border-radius: 22px; min-height: 92px; color: #16130f;
    font-family: var(--display); font-size: 26px; letter-spacing: -0.04em; font-weight: 800;
  }
  .buzz small { display: block; font-family: var(--sans); font-size: 12px; letter-spacing: .08em; font-weight: 700; opacity: .75; }
  .buzz:disabled { filter: grayscale(.4) brightness(.7); }
  .lives { display: flex; gap: 6px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
  .pip.off { background: rgba(255,255,255,.15); }
  .overlay-note { font-size: 13px; color: var(--cream-dim); }
  .winner {
    text-align: center; padding: 40px 10px 20px;
  }
  .winner h2 { font-family: var(--display); font-size: clamp(42px, 7vw, 76px); margin: 0; letter-spacing: -0.05em; }
  .help {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;
  }
  .help div { background: rgba(255,255,255,.03); border-radius: 16px; padding: 12px 14px; }
  .help b { display: block; margin-bottom: 4px; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--cream); color: var(--ink); padding: 12px 16px; border-radius: 999px;
    font-weight: 700; box-shadow: var(--shadow); z-index: 5;
  }
  @media (max-width: 760px) {
    .modes, .choices, .buzzers, .help { grid-template-columns: 1fr; }
    .board { min-width: 720px; }
    h1 { font-size: 46px; }
  }
</style>
</head>

s ride into Jerusalem on Palm Sunday?", "choices": ["A white horse", "A camel", "A donkey", "He walked"], "a": "A donkey", "ref": "John 12:14-15"}, {"id": "g11", "cat": "The Gospels", "d": 3, "q": "Only one Gospel records the road to Emmaus. Which?", "choices": ["Matthew", "Mark", "Luke", "John"], "a": "Luke", "ref": "Luke 24:13-35"}, {"id": "g12", "cat": "The Gospels", "d": 3, "q": "Who asked Pilate for Jesus' body and laid it in his own new tomb?", "choices": ["Nicodemus", "Joseph of Arimathea", "Simon of Cyrene", "Gamaliel"], "a": "Joseph of Arimathea", "ref": "Matthew 27:57-60"}, {"id": "g13", "cat": "The Gospels", "d": 3, "q": "Which disciple was invited with 'Come and see' and called an Israelite without deceit?", "choices": ["Philip", "Nathanael", "Thaddaeus", "Andrew"], "a": "Nathanael", "ref": "John 1:45-49"}, {"id": "g14", "cat": "The Gospels", "d": 3, "q": "Matthew's genealogy of Jesus starts with whom?", "choices": ["Adam", "David", "Abraham", "Noah"], "a": "Abraham", "ref": "Matthew 1:1-2"}, {"id": "g15", "cat": "The Gospels", "d": 4, "q": "What was the name of the high priest's servant whose ear Peter cut off?", "choices": ["Malchus", "Caiaphas", "Annas", "Barabbas"], "a": "Malchus", "ref": "John 18:10"}, {"id": "g16", "cat": "The Gospels", "d": 4, "q": "Luke says the census that sent Mary and Joseph to Bethlehem happened while who was governor of Syria?", "choices": ["Pilate", "Quirinius", "Herod Antipas", "Felix"], "a": "Quirinius", "ref": "Luke 2:1-2"}, {"id": "g17", "cat": "The Gospels", "d": 4, "q": "Anna the prophetess, who saw the infant Jesus, was from which tribe?", "choices": ["Judah", "Levi", "Asher", "Naphtali"], "a": "Asher", "ref": "Luke 2:36"}, {"id": "g18", "cat": "The Gospels", "d": 4, "q": "Who carried Jesus' cross after the soldiers compelled him?", "choices": ["Simon of Cyrene", "Joseph of Arimathea", "John", "Nicodemus"], "a": "Simon of Cyrene", "ref": "Mark 15:21"}, {"id": "h01", "cat": "OT Heroes", "d": 1, "q": "Who was swallowed by a great fish after fleeing God's call?", "choices": ["Noah", "Jonah", "Elijah", "Daniel"], "a": "Jonah", "ref": "Jonah 1:17"}, {"id": "h02", "cat": "OT Heroes", "d": 1, "q": "Who defeated Goliath with a sling and a stone?", "choices": ["Saul", "Jonathan", "David", "Samson"], "a": "David", "ref": "1 Samuel 17"}, {"id": "h03", "cat": "OT Heroes", "d": 1, "q": "Who built an ark to survive the flood?", "choices": ["Moses", "Noah", "Abraham", "Enoch"], "a": "Noah", "ref": "Genesis 6-8"}, {"id": "h04", "cat": "OT Heroes", "d": 1, "q": "Who was thrown into a lions' den and came out unharmed?", "choices": ["Daniel", "Joseph", "Jeremiah", "Ezekiel"], "a": "Daniel", "ref": "Daniel 6"}, {"id": "h05", "cat": "OT Heroes", "d": 2, "q": "Who was sold by his brothers and later ruled in Egypt?", "choices": ["Benjamin", "Joseph", "Judah", "Reuben"], "a": "Joseph", "ref": "Genesis 37, 41"}, {"id": "h06", "cat": "OT Heroes", "d": 2, "q": "Which judge defeated the Midianites with only 300 men?", "choices": ["Samson", "Gideon", "Jephthah", "Deborah"], "a": "Gideon", "ref": "Judges 7"}, {"id": "h07", "cat": "OT Heroes", "d": 2, "q": "Who was taken up to heaven in a whirlwind?", "choices": ["Enoch", "Elijah", "Elisha", "Moses"], "a": "Elijah", "ref": "2 Kings 2:11"}, {"id": "h08", "cat": "OT Heroes", "d": 2, "q": "Ruth, a foreign widow, became the great-grandmother of which king?", "choices": ["Saul", "David", "Solomon", "Hezekiah"], "a": "David", "ref": "Ruth 4:17-22"}, {"id": "h09", "cat": "OT Heroes", "d": 3, "q": "Which left-handed judge killed King Eglon of Moab?", "choices": ["Shamgar", "Ehud", "Othniel", "Samson"], "a": "Ehud", "ref": "Judges 3:15-25"}, {"id": "h10", "cat": "OT Heroes", "d": 3, "q": "Who killed 600 Philistines with an ox goad?", "choices": ["Shamgar", "Ehud", "Barak", "Gideon"], "a": "Shamgar", "ref": "Judges 3:31"}, {"id": "h11", "cat": "OT Heroes", "d": 3, "q": "Jael killed the Canaanite commander Sisera with what?", "choices": ["A sword", "A tent peg", "A stone", "Poisoned wine"], "a": "A tent peg", "ref": "Judges 4:21"}, {"id": "h12", "cat": "OT Heroes", "d": 3, "q": "Whose strength was tied to an uncut Nazirite vow, ending when his hair was cut?", "choices": ["Samuel", "Samson", "Elijah", "Jephthah"], "a": "Samson", "ref": "Judges 13-16"}, {"id": "h13", "cat": "OT Heroes", "d": 4, "q": "Who was Moses' father-in-law, priest of Midian?", "choices": ["Jethro", "Hobab", "Aaron", "Caleb"], "a": "Jethro", "ref": "Exodus 3:1; also called Reuel"}, {"id": "h14", "cat": "OT Heroes", "d": 4, "q": "Abraham's wife after Sarah died was named what?", "choices": ["Hagar", "Keturah", "Rebekah", "Bilhah"], "a": "Keturah", "ref": "Genesis 25:1"}, {"id": "h15", "cat": "OT Heroes", "d": 4, "q": "Who was David's loyal friend, the son of King Saul?", "choices": ["Abner", "Joab", "Jonathan", "Ish-bosheth"], "a": "Jonathan", "ref": "1 Samuel 18-20"}, {"id": "h16", "cat": "OT Heroes", "d": 4, "q": "Name one of Job's three friends who came to comfort him.", "choices": ["Eliphaz", "Ezra", "Elihu", "Obadiah"], "a": "Eliphaz", "ref": "Job 2:11 — Eliphaz, Bildad, and Zophar"}, {"id": "p01", "cat": "Paul's Letters", "d": 1, "q": "On the road to which city was Saul stopped by a blinding light?", "choices": ["Jerusalem", "Antioch", "Damascus", "Rome"], "a": "Damascus", "ref": "Acts 9:1-9"}, {"id": "p02", "cat": "Paul's Letters", "d": 1, "q": "Paul's famous chapter on love is found in which letter?", "choices": ["Romans 8", "1 Corinthians 13", "Ephesians 2", "Philippians 4"], "a": "1 Corinthians 13", "ref": "1 Corinthians 13"}, {"id": "p03", "cat": "Paul's Letters", "d": 1, "q": "Which armor piece does Paul call the sword of the Spirit?", "choices": ["Faith", "The word of God", "Salvation", "Truth"], "a": "The word of God", "ref": "Ephesians 6:17"}, {"id": "p04", "cat": "Paul's Letters", "d": 2, "q": "Paul wrote Philippians, Ephesians, Colossians, and Philemon from where?", "choices": ["A synagogue", "Prison", "A ship", "The Areopagus"], "a": "Prison", rs", "d": 3, "q": "How many years did Methuselah live, the oldest age recorded?", "choices": ["777", "969", "930", "500"], "a": "969", "ref": "Genesis 5:27"}, {"id": "n08", "cat": "By the Numbers", "d": 3, "q": "How many tribes of Israel are named from Jacob's sons?", "choices": ["10", "12", "7", "14"], "a": "12", "ref": "Genesis 49"}, {"id": "n09", "cat": "By the Numbers", "d": 3, "q": "How many chapters are in Psalm 119, the longest psalm — actually, how many verses?", "choices": ["119", "150", "176", "100"], "a": "176", "ref": "Psalm 119"}, {"id": "n10", "cat": "By the Numbers", "d": 4, "q": "How many denarii did the good Samaritan give the innkeeper for the wounded man?", "choices": ["2", "10", "30", "100"], "a": "2", "ref": "Luke 10:35"}, {"id": "n11", "cat": "By the Numbers", "d": 4, "q": "The disciples cast lots and chose Matthias to replace Judas, making the group how many again?", "choices": ["11", "12", "13", "70"], "a": "12", "ref": "Acts 1:26"}, {"id": "n12", "cat": "By the Numbers", "d": 4, "q": "Revelation is addressed to how many churches?", "choices": ["3", "7", "12", "10"], "a": "7", "ref": "Revelation 1:4"}, {"id": "s01", "cat": "Who Said It", "d": 1, "q": "'The Lord is my shepherd; I shall not want.' Who is the traditional author?", "choices": ["Solomon", "David", "Moses", "Asaph"], "a": "David", "ref": "Psalm 23"}, {"id": "s02", "cat": "Who Said It", "d": 1, "q": "Who said, 'I am the way, and the truth, and the life'?", "choices": ["Paul", "Jesus", "John the Baptist", "Peter"], "a": "Jesus", "ref": "John 14:6"}, {"id": "s03", "cat": "Who Said It", "d": 2, "q": "Who said, 'As for me and my house, we will serve the Lord'?", "choices": ["Moses", "Joshua", "Caleb", "Samuel"], "a": "Joshua", "ref": "Joshua 24:15"}, {"id": "s04", "cat": "Who Said It", "d": 2, "q": "Who said, 'Am I my brother's keeper?'", "choices": ["Cain", "Abel", "Jacob", "Esau"], "a": "Cain", "ref": "Genesis 4:9"}, {"id": "s05", "cat": "Who Said It", "d": 2, "q": "'Let my people go'  2, "q": "Which Gospel is traditionally linked to Peter's preaching?", "choices": ["Matthew", "Mark", "Luke", "John"], "a": "Mark", "ref": "Early church testimony on Mark"}, {"id": "b04", "cat": "Books & Authors", "d": 2, "q": "Acts continues the story begun in which Gospel?", "choices": ["Matthew", "Mark", "Luke", "John"], "a": "Luke", "ref": "Luke 1:1-4; Acts 1:1"}, {"id": "b05", "cat": "Books & Authors", "d": 2, "q": "Which book is a collection of wise sayings opening with Solomon's name?", "choices": ["Proverbs", "Ecclesiastes", "Job", "Song of Songs"], "a": "Proverbs", "ref": "Proverbs 1:1"}, {"id": "b06", "cat": "Books & Authors", "d": 3, "q": "Which Old Testament book has a single chapter and pronounces judgment on Edom?", "choices": ["Obadiah", "Nahum", "Haggai", "Zephaniah"], "a": "Obadiah", "ref": "Obadiah"}, {"id": "b07", "cat": "Books & Authors", "d": 3, "q": "Lamentations is traditionally connected to which prophet?", "choices": ["Jeremiah", "Isaiah", "Ezekiel", "Daniel"], "a": "Jeremiah", "ref": "Traditional attribution"}, {"id": "b08", "cat": "Books & Authors", "d": 3, "q": "Which book opens 'In the beginning was the Word'?", "choices": ["Genesis", "John", "1 John", "Hebrews"], "a": "John", "ref": "John 1:1"}, {"id": "b09", "cat": "Books & Authors", "d": 4, "q": "Which Pauline letter is addressed to a person, not a church, and is the shortest of Paul's?", "choices": ["Philemon", "Titus", "2 Thessalonians", "Galatians"], "a": "Philemon", "ref": "Philemon"}, {"id": "b10", "cat": "Books & Authors", "d": 4, "q": "'Jesus wept,' often the shortest verse in English Bibles, is found in which Gospel?", "choices": ["John", "Luke", "Mark", "Matthew"], "a": "John", "ref": "John 11:35"}, {"id": "b11", "cat": "Books & Authors", "d": 4, "q": "Parts of Daniel and Ezra are written in which language besides Hebrew?", "choices": ["Greek", "Aramaic", "Latin", "Egyptian"], "a": "Aramaic", "ref": "Daniel 2:4-7:28; Ezra 4:8-6:18"}, {"id": "b12", "cat": "Books & Authors", "d": 4, "q": "Which book is a census-heavy travel narrative of Israel from Sinai to the plains of Moab?", "choices": ["Numbers", "Leviticus", "Deuteronomy", "Joshua"], "a": "Numbers", "ref": "Numbers"}, {"id": "e01", "cat": "Exodus Story", "d": 1, "q": "What sea did Israel cross when fleeing Egypt?", "choices": ["Dead Sea", "Red Sea", "Sea of Galilee", "Mediterranean"], "a": "Red Sea", "ref": "Exodus 14"}, {"id": "e02", "cat": "Exodus Story", "d": 1, "q": "What food appeared on the ground each morning in the wilderness?", "choices": ["Quail", "Manna", "Barley cakes", "Fish"], "a": "Manna", "ref": "Exodus 16"}, {"id": "e03", "cat": "Exodus Story", "d": 2, "q": "Baby Moses was hidden in a basket on which river?", "choices": ["Jordan", "Nile", "Euphrates", "Tigris"], "a": "Nile", "ref": "Exodus 2:3"}, {"id": "e04", "cat": "Exodus Story", "d": 2, "q": "The final plague struck whom in Egypt?", "choices": ["The livestock", "The firstborn", "Pharaoh", "The priests of Ra"], "a": "The firstborn", "ref": "Exodus 12"}, {"id": "e05", "cat": "Exodus Story", "d": 2, "q": "What did Israel put on their doorposts so the destroyer would pass over?", "choices": ["Oil", "Blood of a lamb", "Blue thread", "Salt"], "a": "Blood of a lamb", "ref": "Exodus 12:7"}, {"id": "e06", "cat": "Exodus Story", "d": 3, "q": "While Moses was on the mountain, Aaron made an idol shaped like what?", "choices": ["A serpent", "A golden calf", "A bronze bull", "A pillar"], "a": "A golden calf", "ref": "Exodus 32"}, {"id": "e07", "cat": "Exodus Story", "d": 3, "q": "God spoke to Moses from a bush that did what?", "choices": ["Bloomed in winter", "Burned but was not consumed", "Walked", "Turned to stone"], "a": "Burned but was not consumed", "ref": "Exodus 3:2"}, {"id": "e08", "cat": "Exodus Story", "d": 3, "q": "Who held up Moses' arms during the battle with Amalek?", "choices": ["Aaron and Hur", "Joshua and Caleb", "Nadab and Abihu", "Miriam and Zipporah"], "a": "Aaron and Hur", "ref": "Exodus 17:12"}, {"id": "e09", "cat": "Exodus Story", "d": 4, "q": "Aaron's sons Nadab and Abihu died because they offered what?", "choices": ["Unauthorized fire", "A blemished lamb", "Nothing at all", "Foreign incense"], "a": "Unauthorized fire", "ref": "Leviticus 10:1-2"}, {"id": "e10", "cat": "Exodus Story", "d": 4, "q": "The Tabernacle's innermost room was called what?", "choices": ["The Holy of Holies", "The Court", "The Porch", "The Treasury"], "a": "The Holy of Holies", "ref": "Exodus 26:33"}, {"id": "e11", "cat": "Exodus Story", "d": 4, "q": "What was kept inside the ark of the covenant, among other items?", "choices": ["The tablets of the testimony", "Aaron's crown", "A map of Canaan", "Pharaoh's staff"], "a": "The tablets of the testimony", "ref": "Exodus 25:16; Hebrews 9:4"}, {"id": "e12", "cat": "Exodus Story", "d": 4, "q": "Manna tasted like wafers made with what, according to Exodus?", "choices": ["Honey", "Salt", "Wine", "Figs"], "a": "Honey", "ref": "Exodus 16:31"}, {"id": "k01", "cat": "Kings & Kingdoms", "d": 1, "q": "Who was Israel's first king?", "choices": ["David", "Saul", "Solomon", "Samuel"], "a": "Saul", "ref": "1 Samuel 10"}, {"id": "k02", "cat": "Kings & Kingdoms", "d": 1, "q": "Who asked God for wisdom and built the temple?", "choices": ["David", "Solomon", "Hezekiah", "Josiah"], "a": "Solomon", "ref": "1 Kings 3; 6"}, {"id": "k03", "cat": "Kings & Kingdoms", "d": 2, "q": "The kingdom split after which king's harsh answer to the people?", "choices": ["Solomon", "Rehoboam", "Jeroboam", "Ahab"], "a": "Rehoboam", "ref": "1 Kings 12"}, {"id": "k04", "cat": "Kings & Kingdoms", "d": 2, "q": "Jeroboam set up golden calves in Bethel and where else?", "choices": ["Dan", "Beersheba", "Hebron", "Shiloh"], "a": "Dan", "ref": "1 Kings 12:28-29"}, {"id": "k05", "cat": "Kings & Kingdoms", "d": 2, "q": "Which king of Israel married Jezebel?", "choices": ["Ahab", "Jehu", "Omri", "Ahaz"], "a": "Ahab", "ref": "1 Kings 16:31"}, {"id": "k06", "cat": "Kings & Kingdoms", "d": 3, "q": "Which boy king found the Book of the Law and reformed Judah?", "choices": ["Josiah", "Joash", "Manasseh", "Hezekiah"], "a": "Josiah", "ref": "2 Kings 22"}, {"id": "k07", "cat": "Kings & Kingdoms", "d": 3, "q": "Which empire carried Judah into exile and destroyed Jerusalem in 586 BC?", "choices": ["Assyria", "Babylon", "Persia", "Greece"], "a": "Babylon", "ref": "2 Kings 25"}, {"id": "k08", "cat": "Kings & Kingdoms", "d": 3, "q": "Who conquered Babylon and issued a decree letting exiles return?", "choices": ["Nebuchadnezzar", "Cyrus", "Darius the Mede", "Alexander"], "a": "Cyrus", "ref": "Ezra 1:1-4"}, {"id": "k09", "cat": "Kings & Kingdoms", "d": 4, "q": "Which king of Judah was struck with leprosy for entering the temple to burn incense?", "choices": ["Uzziah", "Ahaz", "Manasseh", "Jehoram"], "a": "Uzziah", "ref": "2 Chronicles 26:16-21"}, {"id": "k10", "cat": "Kings & Kingdoms", "d": 4, "q": "Nehemiah was cupbearer to which Persian king?", "choices": ["Artaxerxes", "Cyrus", "Darius I", "Xerxes"], "a": "Artaxerxes", "ref": "Nehemiah 2:1"}, {"id": "k11", "cat": "Kings & Kingdoms", "d": 4, "q": "Which queen of Judah tried to wipe out the royal line after her son died?", "choices": ["Athaliah", "Jezebel", "Maacah", "Bathsheba"], "a": "Athaliah", "ref": "2 Kings 11"}, {"id": "k12", "cat": "Kings & Kingdoms", "d": 4, "q": "Absalom, David's son, was caught in a tree by what?", "choices": ["His hair", "His cloak", "A spear", "His chariot wheel"], "a": "His hair", "ref": "2 Samuel 18:9"}, {"id": "c01", "cat": "Beginnings", "d": 1, "q": "On which day of creation did God rest?", "choices": ["The sixth", "The seventh", "The first", "The third"], "a": "The seventh", "ref": "Genesis 2:2-3"}, {"id": "c02", "cat": "Beginnings", "d": 1, "q": "Who killed his brother Abel?", "choices": ["Seth", "Cain", "Lamech", "Enoch"], "a": "Cain", "ref": "Genesis 4:8"}, {"id": "c03", "cat": "Beginnings", "d": 1, "q": "God promised Abraham descendants as numerous as what?", "choices": ["The sand at": "Acts", "d": 4, "q": "Paul appealed to Caesar while on trial before which governor?", "choices": ["Festus", "Pilate", "Quirinius", "Gallio"], "a": "Festus", "ref": "Acts 25:11-12"}, {"id": "a11", "cat": "Acts", "d": 4, "q": "Who fell out of a window while Paul preached long in Troas, and was restored?", "choices": ["Eutychus", "Tychicus", "Trophimus", "Gaius"], "a": "Eutychus", "ref": "Acts 20:9-12"}, {"id": "a12", "cat": "Acts", "d": 4, "q": "The Jerusalem Council decided Gentiles did not have to be circumcised. Who presided in the speech Luke highlights?", "choices": ["James", "Peter", "Paul", "Barnabas"], "a": "James", "ref": "Acts 15:13-21"}, {"id": "v01", "cat": "Revelation", "d": 1, "q": "Revelation describes Jesus as the Alpha and the what?", "choices": ["Omega", "Beginning", "Lion", "Lamb"], "a": "Omega", "ref": "Revelation 22:13"}, {"id": "v02", "cat": "Revelation", "d": 1, "q": "John sees a new heaven and a new what?", "choices": ["Earth", "Temple", "Jerusalem", "Sea"], "a": "Earth", "ref": "Revelation 21:1"}, {"id": "v03", "cat": "Revelation", "d": 2, "q": "The first of the four horsemen rides a horse of what color?", "choices": ["White", "Red", "Black", "Pale"], "a": "White", "ref": "Revelation 6:2"}, {"id": "v04", "cat": "Revelation", "d": 2, "q": "Which church is told it is lukewarm?", "choices": ["Laodicea", "Ephesus", "Smyrna", "Philadelphia"], "a": "Laodicea", "ref": "Revelation 3:16"}, {"id": "v05", "cat": "Revelation", "d": 3, "q": "Which church is promised an open door and has little power but has kept the word?", "choices": ["Philadelphia", "Sardis", "Thyatira", "Pergamum"], "a": "Philadelphia", "ref": "Revelation 3:8"}, {"id": "v06", "cat": "Revelation", "d": 3, "q": "The number of the beast in Revelation 13 is what?", "choices": ["666", "777", "144", "12"], "a": "666", "ref": "Revelation 13:18"}, {"id": "v07", "cat": "Revelation", "d": 3, "q": "How many elders does John see seated around the throne?", "choices": ["12", "24", "70", "7"], "a": "24", "ref": "Revelation 4:4"}, {"id": "v08", "cat": "Revelation", "d": 4, "q": "Which church is told that it has abandoned its first love?", "choices": ["Ephesus", "Smyrna", "Philadelphia", "Laodicea"], "a": "Ephesus", "ref": "Revelation 2:4"}, {"id": "v09", "cat": "Revelation", "d": 4, "q": "The new Jerusalem has how many gates?", "choices": ["7", "12", "24", "3"], "a": "12", "ref": "Revelation 21:12"}, {"id": "v10", "cat": "Revelation", "d": 4, "q": "Jesus stands at the door and knocks in the letter to which church?", "choices": ["Laodicea", "Sardis", "Ephesus", "Thyatira"], "a": "Laodicea", "ref": "Revelation 3:20"}, {"id": "v11", "cat": "Revelation", "d": 4, "q": "What is gone in the new creation: no more sea, and God will wipe away every what?", "choices": ["Tear", "Sin offering", "Lamp", "Scroll"], "a": "Tear", "ref": "Revelation 21:4"}, {"id": "v12", "cat": "Revelation", "d": 2, "q": "John is told to write what he sees and send it to the churches in which region?", "choices": ["Asia", "Galatia", "Italy", "Egypt"], "a": "Asia", "ref": "Revelation 1:4, 11"}, {"id": "y01", "cat": "Wisdom Books", "d": 1, "q": "Which short saying book says the fear of the Lord is the beginning of knowledge?", "choices": ["Proverbs", "Job", "Ecclesiastes", "Song of Songs"], "a": "Proverbs", "ref": "Proverbs 1:7"}, {"id": "y02", "cat": "Wisdom Books", "d": 1, "q": "'For everything there is a season' opens a famous poem in which book?", "choices": ["Ecclesiastes", "Psalms", "Proverbs", "Job"], "a": "Ecclesiastes", "ref": "Ecclesiastes 3:1"}, {"id": "y03", "cat": "Wisdom Books", "d": 2, "q": "Job's story begins when he loses what, among other things, after a heavenly challenge?", "choices": ["His wealth, children, and health", "his throne", "His priesthood", "His ship"], "a": "His wealth, children, and health", "ref": "Job 1-2"}, {"id": "y04", "cat": "Wisdom Books", "d": 2, "q": "Psalm 119 is an acrostic celebrating what?", "choices": ["God's word / law", "The temple", "A wedding", "A battle"], "a": "God's word / law", "ref": "Psalm 119"}, {"id": "y05", "cat": "Wisdom Books", "d": 3, "q": "Song of Songs is love poetry traditionally linked to which king?", "choices": ["Solomon", "David", "Hezekiah", "Josiah"], "a": "Solomon", "ref": "Song of Songs 1:1"}, {"id": "y06", "cat": "Wisdom Books", "d": 3, "q": "In Job, who is the younger man who speaks after the three friends?", "choices": ["Elihu", "Eliphaz", "Bildad", "Zophar"], "a": "Elihu", "ref": "Job 32"}, {"id": "y07", "cat": "Wisdom Books", "d": 3, "q": "'Vanity of vanities' is the refrain of which teacher?", "choices": ["The Preacher / Qoheleth", "David", "Moses", "Asaph"], "a": "The Preacher / Qoheleth", "ref": "Ecclesiastes 1:2"}, {"id": "y08", "cat": "Wisdom Books", "d": 4, "q": "Psalm 51 is David's prayer after which sin was exposed?", "choices": ["With Bathsheba and against Uriah", "Numbering the people", "Sparing Agag", "Taking the census"], "a": "With Bathsheba and against Uriah", "ref": "Psalm 51 superscription"}, {"id": "y09", "cat": "Wisdom Books", "d": 4, "q": "Which psalm begins 'My God, my God, why have you forsaken me?'", "choices": ["Psalm 22", "Psalm 23", "Psalm 51", "Psalm 88"], "a": "Psalm 22", "ref": "Psalm 22:1"}, {"id": "y10", "cat": "Wisdom Books", "d": 4, "q": "Proverbs 31 describes a woman of what kind of strength?", "choices": ["Noble character / excellent wife", "Prophetic office", "Queenship in Persia", "Nazirite vow"], "a": "Noble character / excellent wife", "ref": "Proverbs 31:10"}, {"id": "y11", "cat": "Wisdom Books", "d": 1, "q": "Complete the famous line: 'Trust in the Lord with all your heart, and lean not on your own...'", "choices": ["Understanding", "Strength", "Riches", "Plans"], "a": "Understanding", "ref": "Proverbs 3:5"}, {"id": "y12", "cat": "Wisdom Books", "d": 2, "q": "Psalm 1 compares a blessed person to a tree planted by what?", "choices": ["Streams of water", "The temple gate", "Mount Zion", "A vineyard"], "a": "Streams of water", "ref": "Psalm 1:3"}, {"id": "j01", "cat": "Life of Jesus", "d": 1, "q": "Jesus grew up in which town?", "choices": ["Bethlehem", "Nazareth", "Jerusalem", "Capernaum"], "a": "Nazareth", "ref": "Matthew 2:23"}, {"id": "j02", "cat": "Life of Jesus", "d": 1, "q": "How many days was Jesus in the wilderness being tempted?", "choices": ["3", "12", "40", "7"], "a": "40", "ref": "Matthew 4:2"}, {"id": "j03", "cat": "Life of Jesus", "d": 2, "q": "At age 12, Jesus was found by his parents doing what in the temple?", "choices": ["Discussing with the teachers", "Offering a lamb", "Sweeping the courts", "Hiding"], "a": "Discussing with the teachers", "ref": "Luke 2:46"}, {"id": "j04", "cat": "Life of Jesus", "d": 2, "q": "The Sermon on the Mount is found mainly in which Gospel?", "choices": ["Matthew", "Mark", "Luke", "John"], "a": "Matthew", "ref": "Matthew 5-7"}, {"id": "j05", "cat": "Life of Jesus", "d": 2, "q": "Jesus prayed in agony in which garden before his arrest?", "choices": ["Eden", "Gethsemane", "Joseph's garden", "Olivet"], "a": "Gethsemane", "ref": "Matthew 26:36"}, {"id": "j06", "cat": "Life of Jesus", "d": 3, "q": "Which Gospel alone tells of the visit of the magi?", "choices": ["Matthew", "Mark", "Luke", "John"], "a": "Matthew", "ref": "Matthew 2"}, {"id": "j07", "cat": "Life of Jesus", "d": 3, "q": "Pilate offered the crowd a choice between Jesus and which prisoner?", "choices": ["Barabbas", "Barnabas", "Malchus", "Demas"], "a": "Barabbas", "ref": "Matthew 27:16-21"}, {"id": "j08", "cat": "Life of Jesus", "d": 3, "q": "The inscription on the cross was written in Hebrew, Latin, and what?", "choices": ["Greek", "Aramaic", "Egyptian", "Persian"], "a": "Greek", "ref": "John 19:20"}, {"id": "j09", "cat": "Life of Jesus", "d": 4, "q": "'Father, forgive them' is one of the words from the cross, recorded in which Gospel?", "choices": ["Luke", "Matthew", "Mark", "John"], "a": "Luke", "ref": "Luke 23:34"}, {"id": "j10", "cat": "Life of Jesus", "d": 4, "q": "After the resurrection, Jesus cooked breakfast for the disciples beside which sea?", "choices": ["Sea of Tiberias / Galilee", "The Dead Sea", "The Mediterranean", "The Jordan ferry"], "a": "Sea of Tiberias / Galilee", "ref": "John 21:1-12"}, {"id": "j11", "cat": "Life of Jesus", "d": 4, "q": "Jesus appeared to two disciples on the road to which village?", "choices": ["Emmaus", "Bethany", "Cana", "Nain"], "a": "Emmaus", "ref": "Luke 24:13"}, {"id": "j12", "cat": "Life of Jesus", "d": 1, "q": "Who denied knowing Jesus three times before the rooster crowed?", "choices": ["Peter", "John", "Judas", "Andrew"], "a": "Peter", "ref": "Luke 22:54-62"}, {"id": "d01", "cat": "Angels & Dreams", "d": 1, "q": "Who told Mary she would have a son named Jesus?", "choices": ["Gabriel", "Michael", "An unnamed angel", "Raphael"], "a": "Gabriel", "ref": "Luke 1:26-31"}, {"id": "d02", "cat": "Angels & Dreams", "d": 1, "q": "Angels announced Jesus' birth to shepherds near which town?", "choices": ["Bethlehem", "Nazareth", "Hebron", "Jericho"], "a": "Bethlehem", "ref": "Luke 2:8-15"}, {"id": "d03", "cat": "Angels & Dreams", "d": 2, "q": "Jacob dreamed of a stairway to heaven at which place, later named Bethel?", "choices": ["Luz", "Haran", "Peniel", "Beersheba"], "a": "Luz", "ref": "Genesis 28:19"}, {"id": "d04", "cat": "Angels & Dreams", "d": 2, "q": "An angel shut the lions' mouths for whom?", "choices": ["Daniel", "David", "Samson", "Paul"], "a": "Daniel", "ref": "Daniel 6:22"}, {"id": "d05", "cat": "Angels & Dreams", "d": 3, "q": "Joseph, Mary's husband, was warned in a dream to flee to which country?", "choices": ["Egypt", "Syria", "Greece", "Rome"], "a": "Egypt", "ref": "Matthew 2:13"}, {"id": "d06", "cat": "Angels & Dreams", "d": 3, "q": "Cornelius was told in a vision to send for Peter, who was staying in which city?", "choices": ["Joppa", "Caesarea", "Jerusalem", "Antioch"], "a": "Joppa", "ref": "Acts 10:5-6"}, {"id": "d07", "cat": "Angels & Dreams", "d": 3, "q": "An angel freed Peter from prison while the ": "John", "ref": "John 10:22"}, {"id": "z10", "cat": "Worship & Feasts", "d": 4, "q": "The high priest entered the Most Holy Place with blood especially on which day?", "choices": ["The Day of Atonement", "Every Sabbath", "Passover morning", "Pentecost"], "a": "The Day of Atonement", "ref": "Leviticus 16; Hebrews 9:7"}, {"id": "z11", "cat": "Worship & Feasts", "d": 2, "q": "Israel's portable worship tent in the wilderness was called what?", "choices": ["The Tabernacle", "The Temple", "The Synagogue", "The Basilica"], "a": "The Tabernacle", "ref": "Exodus 25-27"}, {"id": "z12", "cat": "Worship & Feasts", "d": 1, "q": "David brought the ark to which city, later the temple city?", "choices": ["Jerusalem", "Hebron", "Shiloh", "Bethel"], "a": "Jerusalem", "ref": "2 Samuel 6"}, {"id": "ds01", "cat": "The Disciples", "d": 1, "q": "Which disciple was a fisherman and also called Simon?", "choices": ["Peter", "Matthew", "Thomas", "Philip"], "a": "Peter", "ref": "Matthew 4:18; John 1:42"}, {"id": "ds02", "cat": "The Disciples", "d": 1, "q": "Which disciple was a tax collector before following Jesus?", "choices": ["Matthew", "Andrew", "Bartholomew", "James"], "a": "Matthew", "ref": "Matthew 9:9"}, {"id": "ds03", "cat": "The Disciples", "d": 1, "q": "Andrew was the brother of which disciple?", "choices": ["Peter", "John", "Philip", "Thomas"], "a": "Peter", "ref": "John 1:40"}, {"id": "ds04", "cat": "The Disciples", "d": 2, "q": "James and John, sons of Zebedee, were nicknamed what?", "choices": ["Sons of Thunder", "The Zealots", "The Twins", "Fishers of Men"], "a": "Sons of Thunder", "ref": "Mark 3:17"}, {"id": "ds05", "cat": "The Disciples", "d": 2, "q": "Which disciple said he would not believe until he saw the wounds?", "choices": ["Thomas", "Peter", "Matthew", "Andrew"], "a": "Thomas", "ref": "John 20:25"}, {"id": "ds06", "cat": "The Disciples", "d": 2, "q": "Who brought Nathanael to Jesus?", "choices": ["Philip", "Andrew", "John", "James"], "a": "Philip", "ref": "John 1:45"}, {"id": "ds07", "cat": "The Disciples", "d": 3, "q": "Which disciple did Herod Agrippa put to death with the sword?", "choices": ["James the brother of John", "Peter", "Matthew", "Philip"], "a": "James the brother of John", "ref": "Acts 12:1-2"}, {"id": "ds08", "cat": "The Disciples", "d": 3, "q": "Jesus told Peter he would be given the keys of what?", "choices": ["The kingdom of heaven", "The temple treasury", "David's city", "The ark"], "a": "The kingdom of heaven", "ref": "Matthew 16:19"}, {"id": "ds09", "cat": "The Disciples", "d": 3, "q": "There were two Judases among the Twelve. The other is also called what?", "choices": ["Thaddaeus", "Barabbas", "Didymus", "Cephas"], "a": "Thaddaeus", "ref": "Matthew 10:3; Luke 6:16"}, {"id": "ds10", "cat": "The Disciples", "d": 4, "q": "Thomas is also called Didymus, which means what?", "choices": ["Twin", "Rock", "Gift of God", "Zealot"], "a": "Twin", "ref": "John 11:16"}, {"id": "ds11", "cat": "The Disciples", "d": 4, "q": "Bartholomew is often identified with which disciple named in John?", "choices": ["Nathanael", "Philip", "Andrew", "Matthew"], "a": "Nathanael", "ref": "John 1:45-49; apostolic lists"}, {"id": "ds12", "cat": "The Disciples", "d": 4, "q": "James the son of Alphaeus is distinguished from James the son of whom?", "choices": ["Zebedee", "Jonah", "Noah", "Jesse"], "a": "Zebedee", "ref": "Matthew 10:2-3"}, {"id": "tj01", "cat": "Teachings of Jesus", "d": 1, "q": "Jesus said the greatest commandment is to love whom with all your heart?", "choices": ["The Lord your God", "Your neighbor", "The temple", "Moses"], "a": "The Lord your God", "ref": "Matthew 22:37"}, {"id": "tj02", "cat": "Teachings of Jesus", "d": 1, "q": "The second great commandment is to love whom as yourself?", "choices": ["Your neighbor", "Your enemies", "Caesar", "The priests"], "a": "Your neighbor", "ref": "Matthew 22:39"}, {"id": "tj03", "cat": "Teachings of Jesus", "d": 1, "q": "In the Golden Rule, do to others what?", "choices": ["You would have them do to you", "The law requires in public", "The priests command", "Rome demands"], "a": "You would have them do to you", "ref": "Matthew 7:12"}, {"id": "tj04", "cat": "Teachings of Jesus", "d": 2, "q": "Jesus said to render to Caesar what is Caesar's, and to God what?", "choices": ["What is God's", "The temple tax", "Nothing", "A tithe of spices"], "a": "What is God's", "ref": "Matthew 22:21"}, {"id": "tj05", "cat": "Teachings of Jesus", "d": 2, "q": "Jesus' new commandment is that the disciples love whom?", "choices": ["One another", "their family", "Israel", "The emperor"], "a": "One another", "ref": "John 13:34"}, {"id": "tj06", "cat": "Teachings of Jesus", "d": 2, "q": "Whoever wants to be first must be what?", "choices": ["Servant of all", "Richest", "Loudest", "A priest"], "a": "Servant of all", "ref": "Mark 9:35"}, {"id": "tj07", "cat": "Teachings of Jesus", "d": 3, "q": "Jesus said it is easier for a camel to go through the eye of a needle than for whom to enter the kingdom?", "choices": ["A rich person", "A Roman", "A Pharisee", "A fisherman"], "a": "A rich person", "ref": "Matthew 19:24"}, {"id": "tj08", "cat": "Teachings of Jesus", "d": 3, "q": "Jesus pronounced woe on Chorazin and Bethsaida because they did not repent after what?", "choices": ["His miracles", "A famine", "A census", "John's death"], "a": "His miracles", "ref": "Matthew 11:21"}, {"id": "tj09", "cat": "Teachings of Jesus", "d": 3, "q": "The sin Jesus says will not be forgiven is blasphemy against whom?", "choices": ["The Holy Spirit", "Moses", "The temple", "Caesar"], "a": "The Holy Spirit", "ref": "Matthew 12:31"}, {"id": "tj10", "cat": "Teachings of Jesus", "d": 4, "q": "In Matthew 5, Jesus says he came not to abolish the Law but to do what?", "choices": ["Fulfill it", "Replace it with Rome's code", "Hide it", "Shorten it"], "a": "Fulfill it", "ref": "Matthew 5:17"}, {"id": "tj11", "cat": "Teachings of Jesus", "d": 4, "q": "Jesus told Nicodemus that no one can see the kingdom unless they are what?", "choices": ["Born again", "Circumcised as an adult", "A rabbi", "From Bethlehem"], "a": "Born again", "ref": "John 3:3"}, {"id": "tj12", "cat": "Teachings of Jesus", "d": 4, "q": "On the night he was betrayed, Jesus said he is the vine and his disciples are what?", "choices": ["The branches", "The soil", "The vinedressers", "The jars"], "a": "The branches", "ref": "John 15:5"}, {"id": "an01", "cat": "Bible Animals", "d": 1, "q": "What animal did the Spirit descend like at Jesus' baptism?", "choices": ["A dove", "An eagle", "A lamb", "A lion"], "a": "A dove", "ref": "Matthew 3:16"}, {"id": "an02", "cat": "Bible Animals", "d": 1, "q": "What animal tempted Eve in Eden?", "choices": ["A serpent", "A lion", "A fox", "A raven"], "a": "A serpent", "ref": "Genesis 3:1"}, {"id": "an03", "cat": "Bible Animals", "d": 1, "q": "Jesus is called the Lamb of God by whom?", "choices": ["John the Baptist", "Pilate", "Herod", "Caiaphas"], "a": "John the Baptist", "ref": "John 1:29"}, {"id": "an04", "cat": "Bible Animals", "d": 2, "q": "Ravens brought food to which prophet by the brook?", "choices": ["Elijah", "Elisha", "Jonah", "Amos"], "a": "Elijah", "ref": "1 Kings 17:4-6"}, {"id": "an05", "cat": "Bible Animals", "d": 2, "q": "Balaam's journey was interrupted by a talking what?", "choices": ["Donkey", "Camel", "Horse", "Ox"], "a": "Donkey", "ref": "Numbers 22:28"}, {"id": "an06", "cat": "Bible Animals", "d": 2, "q": "In the judgment picture, Jesus separates sheep from what?", "choices": ["Goats", "Wolves", "Calves", "Doves"], "a": "Goats", "ref": "Matthew 25:32"}, {"id": "an07", "cat": "Bible Animals", "d": 3, "q": "Gideon asked for a sign with what animal's fleece?", "choices": ["A sheep's", "A goat's", "A lion's", "A camel's"], "a": "A sheep's", "ref": "Judges 6:37"}, {"id": "an08", "cat": "Bible Animals", "d": 3, "q": "Israel grumbled and God sent quail along with manna in the wilderness. Quail are what?", "choices": ["Birds", "Fish", "Insects", "Locusts"], "a": "Birds", "ref": "Exodus 16:13"}, {"id": "an09", "cat": "Bible Animals", "d": 3, "q": "Peter's rooftop vision was a sheet full of what?", "choices": ["Animals", "Scrolls", "Coins", "Loaves"], "a": "Animals", "ref": "Acts 10:11-12"}, {"id": "an10", "cat": "Bible Animals", "d": 4, "q": "Job describes a huge land beast called what?", "choices": ["Behemoth", "Leviathan", "Rahab the dragon", "Cherub"], "a": "Behemoth", "ref": "Job 40:15"}, {"id": "an11", "cat": "Bible Animals", "d": 4, "q": "The sea creature God describes to Job is called what?", "choices": ["Leviathan", "Behemoth", "Tannin of the Nile", "Dagon"], "a": "Leviathan", "ref": "Job 41:1"}, {"id": "an12", "cat": "Bible Animals", "d": 4, "q": "Samson later caught three hundred foxes. Earlier he tore a lion, and bees nested in what?", "choices": ["The lion's carcass", "A hollow tree", "The temple", "A wineskin"], "a": "The lion's carcass", "ref": "Judges 14:8"}, {"id": "lw01", "cat": "Law & Commandments", "d": 1, "q": "How many commandments were given on the stone tablets?", "choices": ["10", "7", "12", "613"], "a": "10", "ref": "Exodus 20"}, {"id": "lw02", "cat": "Law & Commandments", "d": 1, "q": "The commandment about parents says to do what?", "choices": ["Honor them", "Fear the king", "Leave them at twelve", "Bring them a lamb yearly"], "a": "Honor them", "ref": "Exodus 20:12"}, {"id": "lw03", "cat": "Law & Commandments", "d": 1, "q": "Which commandment forbids stealing?", "choices": ["You shall not steal", "You shall not covet", "You shall not murder", "Remember the Sabbath"], "a": "You shall not steal", "ref": "Exodus 20:15"}, {"id": "lw04", "cat": "Law & Commandments", "d": 2, "q": "The Shema begins, Hear, O Israel: the Lord our God, the Lord is what?", "choices": ["One", "Holy fire", "A warrior", "Near"], "a": "One", "ref": "Deuteronomy 6:4"}, {"id": "lw05", "cat": "Law & Commandments", "d": 2, "q": "Cities of refuge were for someone who killed another how?", "choices": ["Accidentally", "In war", "As a priest", "During a famine"], "a": "Accidentally", "ref": "Numbers 35:11"}, {"id": "lw06", "cat": "Law & Commandments", "d": 2, "q": "The tenth commandment forbids what attitude toward a neighbor's goods?", "choices": ["Coveting", "Borrowing", "Selling", "Praising"], "a": "Coveting", "ref": "Exodus 20:17"}, {"id": "lw07", "cat": "Law & Commandments", "d": 3, "q": "Priests used Urim and Thummim to do what?", "choices": ["Seek God's decision", "Grind grain", "Measure oil", "Anoint kings"], "a": "Seek God's decision", "ref": "Exodus 28:30"}, {"id": "lw08", "cat": "Law & Commandments", "d": 3, "q": "Israel was told to put tassels on their garments with a cord of what color?", "choices": ["Blue", "Red", "Gold", "White"], "a": "Blue", "ref": "Numbers 15:38"}, {"id": "lw09", "cat": "Law & Commandments", "d": 3, "q": "The Year of Jubilee came after how many sabbath-year cycles, in the fiftieth year?", "choices": ["Seven cycles", "Three cycles", "Twelve cycles", "One cycle"], "a": "Seven cycles", "ref": "Leviticus 25:8-10"}, {"id": "lw10", "cat": "Law & Commandments", "d": 4, "q": "A goring ox that killed someone could make the owner liable if the ox was known to do what?", "choices": ["Gore before", "Eat firstfruits", "Wander on the Sabbath", "Belong to a priest"], "a": "Gore before", "ref": "Exodus 21:29"}, {"id": "lw11", "cat": "Law & Commandments", "d": 4, "q": "The law of the leper's cleansing includes birds, cedar, scarlet, and what plant?", "choices": ["Hyssop", "Myrrh", "Mandrake", "Reed"], "a": "Hyssop", "ref": "Leviticus 14:4"}, {"id": "lw12", "cat": "Law & Commandments", "d": 4, "q": "Deuteronomy says a king of Israel should not acquire many what?", "choices": ["Horses", "Psalms", "Slingstones", "Tassels"], "a": "Horses", "ref": "Deuteronomy 17:16"}, {"id": "xm01", "cat": "Christmas Story", "d": 1, "q": "Where was the newborn Jesus laid?", "choices": ["A manger", "A palace bed", "The temple altar", "A fishing boat"], "a": "A manger", "ref": "Luke 2:7"}, {" ilder would be his son because David had done what?", "choices": ["Shed much blood", "Been a shepherd", "Fled from Saul", "Married many wives"], "a": "Shed much blood", "ref": "1 Chronicles 22:8"}, {"id": "tm04", "cat": "Temple & Priests", "d": 2, "q": "The boy Samuel served at the tabernacle under which priest?", "choices": ["Eli", "Aaron", "Zadok", "Abiathar"], "a": "Eli", "ref": "1 Samuel 3:1"}, {"id": "tm05", "cat": "Temple & Priests", "d": 2, "q": "Jesus drove out merchants and money-changers from where?", "choices": ["The temple courts", "The synagogue in Nazareth", "Pilate's hall", "The Mount of Olives"], "a": "The temple courts", "ref": "Matthew 21:12"}, {"id": "tm06", "cat": "Temple & Priests", "d": 3, "q": "Which priest survived Saul's slaughter of the priests at Nob and later served David?", "choices": ["Abiathar", "Eli", "Zadok", "Caiaphas"], "a": "Abiathar", "ref": "1 Samuel 22:20"}, {"id": "tm07", "cat": "Temple & Priests", "d": 3, "q": "The veil torn at the crucifixion separated the Holy Place from what?", "choices": ["The Most Holy Place", "The Court of Women", "The porch", "The treasury"], "a": "The Most Holy Place", "ref": "Matthew 27:51; Hebrews 9"}, {"id": "tm08", "cat": "Temple & Priests", "d": 3, "q": "Herod's temple is the setting of Jesus' visits. Who began rebuilding the earlier temple after exile?", "choices": ["Zerubbabel", "Nehemiah built walls", "Josiah", "Hezekiah"], "a": "Zerubbabel", "ref": "Ezra 3:8"}, {"id": "tm09", "cat": "Temple & Priests", "d": 4, "q": "High priest at Jesus' trial before the council was whom?", "choices": ["Caiaphas", "Annas had been high priest", "Aaron", "Zadok"], "a": "Caiaphas", "ref": "Matthew 26:57"}, {"id": "tm10", "cat": "Temple & Priests", "d": 4, "q": "Jesus was first taken to Annas, father-in-law of whom?", "choices": ["Caiaphas", "Pilate", "Herod", "Gamaliel"], "a": "Caiaphas", "ref": "John 18:13"}, {"id": "tm11", "cat": "Temple & Priests", "d": 4, "q": "The tribe set apart for priestly service was which?", "choices": ["Levi", "Judah", "Benjamin", "Ephraim"], "a": "Levi", "ref": "Deuteronomy 18:1-5"}, {"id": "tm12", "cat": "Temple & Priests", "d": 4, "q": "Melchizedek, whom Hebrews compares to Jesus, was king of Salem and a priest without a listed what?", "choices": ["Genealogy", "Sacrifice", "City", "Name"], "a": "Genealogy", "ref": "Hebrews 7:3"}, {"id": "ch01", "cat": "Churches of Paul", "d": 1, "q": "Paul wrote a letter to Christians in which capital, where he also wanted to visit?", "choices": ["Rome", "Athens", "Alexandria", "Babylon"], "a": "Rome", "ref": "Romans 1:7"}, {"id": "ch02", "cat": "Churches of Paul", "d": 1, "q": "The church in Corinth struggled with division and also with what famous love chapter's context?", "choices": ["Pride and disorder in worship", "A shipwreck", "The Jerusalem council", "Idol meat"], "a": "Pride and disorder in worship", "ref": "1 Corinthians 1, 11-14"}, {"id": "ch03", "cat": "Churches of Paul", "d": 2, "q": "Lydia and the jailer were early believers in which city?", "choices": ["Philippi", "Ephesus", "Corinth", "Thessalonica"], "a": "Philippi", "ref": "Acts 16"}, {"id": "ch04", "cat": "Churches of Paul", "d": 2, "q": "Paul reasoned in the synagogue and left for Athens from which Macedonian city known for a letter?", "choices": ["Thessalonica", "Philippi", "Berea", "Corinth"], "a": "Thessalonica", "ref": "Acts 17:1-10"}, {"id": "ch05", "cat": "Churches of Paul", "d": 2, "q": "The Ephesian letter includes the armor of God and also says believers are saved by grace through what?", "choices": ["Faith", "Works of the law", "Circumcision", "Philosophy"], "a": "Faith", "ref": "Ephesians 2:8"}, {"id": "ch06", "cat": "Churches of Paul", "d": 3, "q": "Which city had a church Paul did not found, addressed in a letter about the supremacy of Christ?", "choices": ["Colossae", "Philippi", "Thessalonica", "Corinth"], "a": "Colossae", "ref": "Colossians 1:15-20; 2:1"}, {"id": "ch07", "cat": "Churches of Paul", "d": 3, "q": "The Galatian
