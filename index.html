<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12100e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Showdown" />
<title>Scripture Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,560;700;800&family=Outfit:wght@380;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #12100e;
    --bg-2: #1c1814;
    --ink: #16130f;
    --cream: #f4efe4;
    --cream-dim: #d9d0c0;
    --gold: #f0c36a;
    --gold-2: #c9843c;
    --teal: #2fbfa8;
    --coral: #ef6a52;
    --blue: #7aa2ff;
    --board: #141c2e;
    --tile: #1e2b46;
    --line: rgba(240,195,106,.28);
    --shadow: 0 24px 60px rgba(0,0,0,.35);
    --display: "Bricolage Grotesque", Georgia, serif;
    --sans: Outfit, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    color: var(--cream);
    background:
      radial-gradient(1000px 520px at 80% -10%, rgba(240,195,106,.16), transparent 55%),
      radial-gradient(800px 480px at -10% 110%, rgba(47,191,168,.12), transparent 50%),
      var(--bg);
    min-height: 100%;
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  #app { min-height: 100%; }
  .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0 8px; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; padding: 0; text-align: left; }
  .mark {
    width: 42px; height: 42px; border-radius: 13px;
    background: linear-gradient(160deg, var(--gold), #8a5a22);
    color: var(--ink); display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; letter-spacing: -0.04em;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
  }
  .brand b { display: block; font-family: var(--display); font-size: 18px; letter-spacing: -0.03em; }
  .brand span { display: block; color: var(--cream-dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .icon-btn, .ghost {
    background: rgba(255,255,255,.04);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: 10px 14px;
    font-weight: 600;
  }
  .icon-btn:hover, .ghost:hover { border-color: var(--line); }
  .hero { padding: 28px 0 18px; }
  .kicker {
    color: var(--gold); letter-spacing: .18em; text-transform: uppercase;
    font-size: 12px; font-weight: 700; margin: 0 0 10px;
  }
  h1 {
    font-family: var(--display); font-weight: 800; letter-spacing: -0.045em;
    font-size: clamp(42px, 7vw, 84px); line-height: .9; margin: 0 0 14px;
  }
  h1 em { font-style: normal; color: var(--gold); }
  .lede { max-width: 640px; color: var(--cream-dim); font-size: 18px; line-height: 1.45; margin: 0 0 22px; }
  .phone-note { max-width: 640px; color: var(--gold); font-size: 15px; line-height: 1.4; margin: -8px 0 22px; }
  .levels { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    color: var(--cream);
    border-radius: 999px;
    padding: 10px 14px;
    font-weight: 650;
  }
  .chip.on { background: var(--gold); color: var(--ink); border-color: transparent; }
  .modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .mode {
    text-align: left; color: var(--cream);
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px; padding: 20px 20px 18px;
    box-shadow: var(--shadow); min-height: 180px;
    display: flex; flex-direction: column; gap: 8px;
    transition: transform .18s ease, border-color .18s ease;
  }
  .mode:hover { transform: translateY(-3px); border-color: var(--line); }
  .mode .tag { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .mode h2 { font-family: var(--display); font-size: 30px; margin: 0; letter-spacing: -0.03em; }
  .mode p { margin: 0; color: var(--cream-dim); line-height: 1.4; }
  .mode .go { margin-top: auto; color: var(--gold); font-weight: 700; }
  .fresh {
    margin: 22px 0 30px; color: var(--cream-dim); font-size: 14px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .meter { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; width: min(280px, 100%); }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-2), var(--gold)); }
  .panel {
    width: min(980px, calc(100% - 32px)); margin: 28px auto 40px;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px; padding: 28px; box-shadow: var(--shadow);
  }
  .panel h2 { font-family: var(--display); font-size: 40px; margin: 0 0 8px; letter-spacing: -0.04em; }
  .sub { color: var(--cream-dim); margin: 0 0 18px; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .team-row { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: center; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; }
  input[type="text"], input[type="number"] {
    width: 100%; background: #0e0c0a; color: var(--cream);
    border: 1px solid rgba(255,255,255,.1); border-radius: 14px;
    padding: 14px 14px; font-size: 16px;
  }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .primary {
    background: var(--gold); color: var(--ink); border: 0; border-radius: 999px;
    padding: 14px 18px; font-weight: 800; letter-spacing: -0.02em; font-size: 16px;
  }
  .primary:hover { filter: brightness(1.05); }
  .scorebug {
    display: flex; gap: 8px; overflow: auto; padding-bottom: 8px;
  }
  .bug {
    min-width: 112px; background: #201c17; border-radius: 16px; padding: 10px 12px; flex: 1;
    border: 1px solid rgba(255,255,255,.06); position: relative;
  }
  .bug.on { outline: 2px solid var(--gold); }
  .bug .nm { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .bug .sc { font-family: var(--display); font-size: 28px; letter-spacing: -0.04em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .board-wrap { overflow: auto; padding-bottom: 20px; }
  .board {
    display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr));
    gap: 8px; min-width: 860px;
  }
  .cat, .cell {
    border-radius: 14px; border: 0; color: var(--cream);
  }
  .cat {
    background: #2a2118; min-height: 84px; padding: 10px;
    font-family: var(--display); font-weight: 800; letter-spacing: -0.03em;
    font-size: 16px; line-height: 1.1;
    box-shadow: inset 0 -3px 0 var(--gold-2);
  }
  .cell {
    background: linear-gradient(180deg, #243656, #1a2742);
    min-height: 72px; font-family: var(--display); font-size: 28px;
    color: var(--gold); letter-spacing: -0.04em;
    box-shadow: inset 0 0 0 1px rgba(240,195,106,.18);
  }
  .cell:hover:not(:disabled) { filter: brightness(1.12); }
  .cell:disabled { color: transparent; background: #121820; box-shadow: none; }
    .stage {
    min-height: calc(100vh - 40px);
    display: flex; flex-direction: column; gap: 16px; padding-bottom: 28px;
  }
  .clue {
    margin-top: 8px; background: #f4efe4; color: #1a140f;
    border-radius: 28px; padding: clamp(22px, 4vw, 42px);
    min-height: 280px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: center;
  }
  .clue .meta { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; font-weight: 800; color: #8a5a22; }
  .clue h2 { font-family: var(--display); font-size: clamp(28px, 4vw, 46px); letter-spacing: -0.04em; margin: 10px 0 0; line-height: 1.05; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    text-align: left; background: #241f1a; color: var(--cream);
    border: 1px solid rgba(255,255,255,.06); border-radius: 16px;
    padding: 16px 16px; font-size: 17px; font-weight: 650; min-height: 72px;
  }
  .choice:hover:not(:disabled) { border-color: var(--gold); }
  .choice.good { background: #174940; border-color: var(--teal); }
  .choice.bad { background: #5a2a24; border-color: var(--coral); }
  .choice:disabled { cursor: default; }
  .ref { color: var(--cream-dim); font-size: 14px; }
  .timer {
    height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden;
  }
  .timer > i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left center; }
  .timer.warn > i { background: var(--coral); }
  .buzzers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .buzz {
    border: 0; border-radius: 22px; min-height: 92px; color: #16130f;
    font-family: var(--display); font-size: 26px; letter-spacing: -0.04em; font-weight: 800;
  }
  .buzz small { display: block; font-family: var(--sans); font-size: 12px; letter-spacing: .08em; font-weight: 700; opacity: .75; }
  .buzz:disabled { filter: grayscale(.4) brightness(.7); }
  .lives { display: flex; gap: 6px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
  .pip.off { background: rgba(255,255,255,.15); }
  .overlay-note { font-size: 13px; color: var(--cream-dim); }
  .winner {
    text-align: center; padding: 40px 10px 20px;
  }
  .winner h2 { font-family: var(--display); font-size: clamp(42px, 7vw, 76px); margin: 0; letter-spacing: -0.05em; }
  .help {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;
  }
  .help div { background: rgba(255,255,255,.03); border-radius: 16px; padding: 12px 14px; }
  .help b { display: block; margin-bottom: 4px; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--cream); color: var(--ink); padding: 12px 16px; border-radius: 999px;
    font-weight: 700; box-shadow: var(--shadow); z-index: 5;
  }
  @media (max-width: 760px) {
    .modes, .choices, .buzzers, .help { grid-template-columns: 1fr; }
    .board { min-width: 720px; }
    h1 { font-size: 46px; }
  }
</style>
</head>

spels","d":3,"q":"Only one Gospel records the road to Emmaus. Which?","choices":["Matthew","Mark","Luke","John"],"a":"Luke","ref":"Luke 24:13-35"},{"id":"g12","cat":"The Gospels","d":3,"q":"Who asked for Jesus' body and laid it in his own new tomb?","choices":["Nicodemus","Joseph of Arimathea","Simon of Cyrene","Gamaliel"],"a":"Joseph of Arimathea","ref":"Matthew 27:57-60"},{"id":"g13","cat":"The Gospels","d":3,"q":"Which disciple was invited with 'Come and see' and was called an Israelite without deceit?","choices":["Philip","Nathanael","Thaddaeus","Andrew"],"a":"Nathanael","ref":"John 1:45-49"},{"id":"g14","cat":"The Gospels","d":3,"q":"Matthew's genealogy of Jesus starts with whom?","choices":["Adam","David","Abraham","Noah"],"a":"Abraham","ref":"Matthew 1:1-2"},{"id":"g15","cat":"The Gospels","d":4,"q":"What was the name of the high priest's servant whose ear Peter cut off?","choices":["Malchus","Caiaphas","Annas","Barabbas"],"a":"Malchus","ref":"John 18:10"},{"id":"g16","cat":"The Gospels","d":4,"q":"Luke says the census that sent Mary and Joseph to Bethlehem happened while who was governor of Syria?","choices":["Pilate","Quirinius","Herod Antipas","Felix"],"a":"Quirinius","ref":"Luke 2:1-2"},{"id":"g17","cat":"The Gospels","d":4,"q":"Anna the prophetess, who saw the infant Jesus, was from which tribe?","choices":["Judah","Levi","Asher","Naphtali"],"a":"Asher","ref":"Luke 2:36"},{"id":"g18","cat":"The Gospels","d":4,"q":"Who carried Jesus' cross after the soldiers compelled him?","choices":["Simon of Cyrene","Joseph of Arimathea","John","Nicodemus"],"a":"Simon of Cyrene","ref":"Mark 15:21"},{"id":"h01","cat":"OT Heroes","d":1,"q":"Who was swallowed by a great fish after fleeing God's call?","choices":["Noah","Jonah","Elijah","Daniel"],"a":"Jonah","ref":"Jonah 1:17"},{"id":"h02","cat":"OT Heroes","d":1,"q":"Who defeated Goliath with a sling and a stone?","choices":["Saul","Jonathan","David","Samson"],"a":"David","ref":"1 Samuel 17"},{"id":"h03","cat":"OT Heroes","d":1,"q":"Who built an ark to survive the flood?","choices":["Moses","Noah","Abraham","Enoch"],"a":"Noah","ref":"Genesis 6-8"},{"id":"h04","cat":"OT Heroes","d":1,"q":"Who was thrown into a lions' den and came out unharmed?","choices":["Daniel","Joseph","Jeremiah","Ezekiel"],"a":"Daniel","ref":"Daniel 6"},{"id":"h05","cat":"OT Heroes","d":2,"q":"Who was sold by his brothers and later ruled in Egypt?","choices":["Benjamin","Joseph","Judah","Reuben"],"a":"Joseph","ref":"Genesis 37, 41"},{"id":"h06","cat":"OT Heroes","d":2,"q":"Which judge defeated the Midianites with only 300 men?","choices":["Samson","Gideon","Jephthah","Deborah"],"a":"Gideon","ref":"Judges 7"},{"id":"h07","cat":"OT Heroes","d":2,"q":"Who was taken up to heaven in a whirlwind?","choices":["Enoch","Elijah","Elisha","Moses"],"a":"Elijah","ref":"2 Kings 2:11"},{"id":"h08","cat":"OT Heroes","d":2,"q":"Ruth, a foreign widow, became the great-grandmother of which king?","choices":["Saul","David","Solomon","Hezekiah"],"a":"David","ref":"Ruth 4:17-22"},{"id":"h09","cat":"OT Heroes","d":3,"q":"Which left-handed judge killed King Eglon of Moab?","choices":["Shamgar","Ehud","Othniel","Samson"],"a":"Ehud","ref":"Judges 3:15-25"},{"id":"h10","cat":"OT Heroes","d":3,"q":"Who killed 600 Philistines with an ox goad?","choices":["Shamgar","Ehud","Barak","Gideon"],"a":"Shamgar","ref":"Judges 3:31"},{"id":"h11","cat":"OT Heroes","d":3,"q":"Jael killed the Canaanite commander Sisera with what?","choices":["A sword","A tent peg","A stone","Poisoned wine"],"a":"A tent peg","ref":"Judges 4:21"},{"id":"h12","cat":"OT Heroes","d":3,"q":"Whose strength was tied to an uncut Nazirite vow, ending when his was cut?","choices":["Samuel","Samson","Elijah","Jephthah"],"a":"Samson","ref":"Judges 13-16"},{"id":"h13","cat":"OT Heroes","d":4,"q":"Who was Moses' father-in-law, priest of Midian?","choices":["Jethro","Hobab","Aaron","Caleb"],"a":"Jethro","ref":"Exodus 3:1; also called Reuel"},{"id":"h14","cat":"OT Heroes","d":4,"q":"Abra :"Song of Songs","d":2,"q":"I am my beloved's and my beloved is mine, in which chapter?","choices":["6","1","2","8"],"a":"6","ref":"Song of Songs 6:3"},{"id":"sng07","cat":"Song of Songs","d":2,"q":"Place me like a seal over your heart, in which chapter?","choices":["8","1","2","4"],"a":"8","ref":"Song of Songs 8:6"},{"id":"sng08","cat":"Song of Songs","d":2,"q":"The winter is past; the rains are over and gone, in which chapter?","choices":["2","1","4","8"],"a":"2","ref":"Song of Songs 2:11"},{"id":"sng09","cat":"Song of Songs","d":3,"q":"The book has how many chapters?","choices":["8","5","12","3"],"a":"8","ref":"Song of Songs"},{"id":"sng10","cat":"Song of Songs","d":3,"q":"Love is as strong as death, in which chapter?","choices":["8","1","2","4"],"a":"8","ref":"Song of Songs 8:6"},{"id":"sng11","cat":"Song of Songs","d":3,"q":"The daughters of Jerusalem are addressed throughout. They are urged not to awaken love until it so desires, in which chapter?","choices":["2 and 8","1","4","6"],"a":"2 and 8","ref":"Song of Songs 2:7; 8:4"},{"id":"sng12","cat":"Song of Songs","d":4,"q":"The book is also called the Song of Solomon or Canticles. It sits among the wisdom books after which book?","choices":["Ecclesiastes","Proverbs","Job","Psalms"],"a":"Ecclesiastes","ref":"Canonical order"},{"id":"lm01","cat":"Lamentations","d":1,"q":"Lamentations mourns the fall of which city?","choices":["Jerusalem","Babylon","Nineveh","Samaria"],"a":"Jerusalem","ref":"Lamentations 1"},{"id":"lm02","cat":"Lamentations","d":1,"q":"How deserted lies the city, once so full of people, opens which chapter?","choices":["1","2","3","5"],"a":"1","ref":"Lamentations 1:1"},{"id":"lm03","cat":"Lamentations","d":1,"q":"Because of the Lord's great love we are not consumed, for his compassions never fail, in which chapter?","choices":["3","1","2","5"],"a":"3","ref":"Lamentations 3:22"},{"id":"lm04","cat":"Lamentations","d":1,"q":"They are new every morning; great is your faithfulness, in which chapter?","choices":["3","1","2","5"],"a":"3","ref":"Lamentations 3:23"},{"id":"lm05","cat":"Lamentations","d":2,"q":"The book is traditionally linked to which prophet?","choices":["Jeremiah","Isaiah","Ezekiel","Daniel"],"a":"Jeremiah","ref":"Tradition; the weeping prophet"},{"id":"lm06","cat":"Lamentations","d":2,"q":"Each of the first four chapters is an acrostic. Chapter 3 has how many verses?","choices":["66","22","44","88"],"a":"66","ref":"Lamentations 3"},{"id":"lm07","cat":"Lamentations","d":2,"q":"The Lord is my portion; therefore I will wait for him, in which chapter?","choices":["3","1","2","5"],"a":"3","ref":"Lamentations 3:24"},{"id":"lm08","cat":"Lamentations","d":2,"q":"It is good to wait quietly for the salvation of the Lord, in which chapter?","choices":["3","1","2","5"],"a":"3","ref":"Lamentations 3:26"},{"id":"lm09","cat":"Lamentations","d":3,"q":"The book has how many chapters?","choices":["5","3","4","12"],"a":"5","ref":"Lamentations"},{"id":"lm10","cat":"Lamentations","d":3,"q":"Remember, Lord, what has happened to us, opens which chapter?","choices":["5","1","3","4"],"a":"5","ref":"Lamentations 5:1"},{"id":"lm11","cat":"Lamentations","d":3,"q":"The children's hunger and the siege are pictured in which early chapters?","choices":["1-2","3","5","4"],"a":"1-2","ref":"Lamentations 1-2"},{"id":"lm12","cat":"Lamentations","d":4,"q":"Restore us to yourself, Lord, that we may return; renew our days as of old, closes which chapter?","choices":["5","1","3","4"],"a":"5","ref":"Lamentations 5:21"},{"id":"mt201","cat":"Matthew's Gospel","d":1,"q":"Matthew opens with a genealogy from Abraham to whom?","choices":["Jesus","David","Moses","Adam"],"a":"Jesus","ref":"Matthew 1:1-17"},{"id":"mt202","cat":"Matthew's Gospel","d":1,"q":"The wise men came from the east seeking the king of the Jews, in which chapter?","choices":["2","1","3","4"],"a":"2","ref":"Matthew 2"},{"id":"mt203","cat":"Matthew's Gospel","d":1,"q":"John the Baptist prepared the way, and Jesus was baptized in the Jordan, in which chapter?","choices":["3","1","2","4"],"a":"3","ref":"Matthew 3"},{"id":"mt204","cat":"Matthew's Gospel","d":1,"q":"The Sermon on the Mount is in which chapters?","choices":["5-7","1-2","13","24-25"],"a":"5-7","ref":"Matthew 5-7"},{"id":"mt205","cat":"Matthew's Gospel","d":2,"q":"The parables of the kingdom fill much of which chapter?","choices":["13","5","24","28"],"a":"13","ref":"Matthew 13"},{"id":"mt206","cat":"Matthew's Gospel","d":2,"q":"Peter's confession and the promise of the keys are in which chapter?","choices":["16","14","17","26"],"a":"16","ref":"Matthew 16:16-19"},{"id":"mt207","cat":"Matthew's Gospel","d":2,"q":"The Olivet Discourse about the end is in which chapters?","choices":["24-25","5-7","13","26-28"],"a":"24-25","ref":"Matthew 24-25"},{"id":"mt208","cat":"Matthew's Gospel","d":2,"q":"The Great Commission is in which chapter?","choices":["28","1","16","26"],"a":"28","ref":"Matthew 28:18-20"},{"id":"mt209","cat":"Matthew's Gospel","d":3,"q":"Matthew is traditionally linked to which disciple?","choices":["Matthew the tax collector","Peter","John","Andrew"],"a":"Matthew the tax collector","ref":"Matthew 9:9; tradition"},{"id":"mt210","cat":"Matthew's Gospel","d":3,"q":"Jesus said, Come to me, all you who are weary, in which chapter?","choices":["11","5","16","28"],"a":"11","ref":"Matthew 11:28"},{"id":"mt211","cat":"Matthew's Gospel","d":3,"q":"The feeding of the five thousand and walking on water are in which chapter?","choices":["14","8","13","21"],"a":"14","ref":"Matthew 14"},{"id":"mt212","cat":"Matthew's Gospel","d":4,"q":"Matthew quotes the Old Testament often with the formula, This was to fulfill what was spoken by the prophet. The flight to Egypt fulfills Hosea in which chapter?","choices":["2","1","3","4"],"a":"2","ref":"Matthew 2:15"}]</script>
<script>
const BANK = JSON.parse(document.getElementById('bank').textContent);
const CATS = [...new Set(BANK.map(q => q.cat))];
const DONATE_URL = 'https://paypal.me/ScriptureShowdown';
const COLORS = ['#f0c36a', '#2fbfa8', '#ef6a52', '#7aa2ff', '#d57bff', '#e7f07a'];
const NAMES = ['Lions', 'Scrolls', 'Trumpets', 'Olives', 'Cedars', 'Lambs'];
const BUZZ_KEYS = ['1', 'Z', 'V', 'M', '/', '='];
const LEVELS = [
  { id: 'climb', label: 'Full climb' },
  { id: 1, label: 'Easy' },
  { id: 2, label: 'Medium' },
  { id: 3, label: 'Hard' },
  { id: 4, label: 'Extreme' }
];
const state = {
  view: 'home',
  level: 'climb',
  mode: 'board',
  teams: [],
  turn: 0,
  used: new Set(JSON.parse(sessionStorage.getItem('ss-used') || '[]')),
  sound: localStorage.getItem('ss-sound') !== 'off',
  board: null,
  clue: null,
  lock: false,
  timer: null,
  clock: 20,
  study: null,
  lastCats: []
};
try {
  const savedNames = JSON.parse(localStorage.getItem('ss-teams') || '[]');
  const savedCount = Number(localStorage.getItem('ss-team-count') || 0);
  if (Array.isArray(savedNames) && savedNames.length) {
    state.teams = savedNames.slice(0, 6).map((name, i) => ({ name, color: COLORS[i], score: 0, lives: 3, wager: 0, finalPick: '' }));
    state.teamCount = savedCount || savedNames.length;
  }
} catch (e) {}

function saveUsed() { sessionStorage.setItem('ss-used', JSON.stringify([...state.used])); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function levelLabel() { return LEVELS.find(l => l.id === state.level).label; }
function allowed(q) { return state.level === 'climb' || q.d === state.level; }
function remaining() { return BANK.filter(q => allowed(q) && !state.used.has(q.id)).length; }
function poolSize() { return BANK.filter(allowed).length; }
function clearTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
function startClueTimer() {
  clearTimer();
  state.clock = 20;
  state.timer = setInterval(() => {
    state.clock -= 0.1;
    const bar = document.querySelector('.timer > i');
    const label = document.querySelector('[data-clock]');
    if (bar) {
      bar.style.transform = `scaleX(${Math.max(0, state.clock / 20)})`;
      bar.parentElement.classList.toggle('warn', state.clock <= 5);
    }
    if (label) label.textContent = `${Math.max(0, Math.ceil(state.clock))}s`;
    if (state.clock <= 0) clueTimeout();
  }, 100);
}
function clueTimeout() {
  clearTimer();
  if (state.view === 'clue' && state.clue) boardTimeout();
  else if (state.view === 'buzzer' && state.buzzer && !state.buzzer.note) buzzTimeout();
}
function boardTimeout() {
  if (state.view !== 'clue' || !state.clue) return;
  const c = state.clue;
  c.picked = null;
  c.correct = false;
  const pts = c.wager || c.value;
  if (c.dd) currentTeam().score -= pts;
  miss();
  c.offerSteal = state.teams.length > 1 && !c.dd && !c.stolen;
  state.view = 'resolve';
  render();
}
function buzzTimeout() {
  const B = state.buzzer;
  if (!B || B.note) return;
  if (B.buzzed != null) B.locked.add(B.buzzed);
  B.buzzed = null;
  B.lock = true;
  B.note = `Time. Answer: ${B.q.a}. ${B.q.ref}`;
  miss();
  render();
}
function clockBar() {
  const left = state.clock == null ? 20 : state.clock;
  return `<div class="timer${left<=5?' warn':''}"><i style="transform:scaleX(${Math.max(0, left/20)})"></i></div><p class="overlay-note" data-clock>${Math.max(0, Math.ceil(left))}s</p>`;
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function tone(freq, dur, type, gain) {
  if (!state.sound) return;
  try {
    const ctx = state.ctx || (state.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = gain || 0.05;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur);
  } catch (e) {}
}
function fanfare() { tone(523, .12); setTimeout(() => tone(659, .12), 90); setTimeout(() => tone(784, .22), 180); }
function miss() { tone(180, .22, 'square', .04); }

function pickQuestion(cat, diff) {
  const base = BANK.filter(q => !state.used.has(q.id) && allowed(q));
  let pool = base.filter(q => q.cat === cat && (state.level !== 'climb' || q.d === diff));
  if (!pool.length) pool = base.filter(q => q.cat === cat);
  if (!pool.length) pool = base.filter(q => state.level === 'climb' ? q.d === diff : true);
  if (!pool.length) {
    state.used.clear();
    saveUsed();
    toast('Question scroll recycled. Fresh pass.');
    return pickQuestion(cat, diff);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildBoard() {
  const diffs = [1, 1, 2, 3, 4];
  const ranked = shuffle(CATS).map(cat => ({
    cat,
    n: BANK.filter(q => q.cat === cat && !state.used.has(q.id) && allowed(q)).length
  })).sort((a, b) => b.n - a.n);
  let chosen = ranked.filter(c => !state.lastCats.includes(c.cat) && c.n > 0).slice(0, 6).map(c => c.cat);
  if (chosen.length < 6) chosen = ranked.filter(c => c.n > 0).slice(0, 6).map(c => c.cat);
  if (chosen.length < 6) chosen = shuffle(CATS).slice(0, 6);
  state.lastCats = chosen.slice();
  const values = [100, 200, 300, 400, 500];
  const cells = [];
  chosen.forEach((cat, col) => {
    values.forEach((value, row) => {
      const q = pickQuestion(cat, diffs[row]);
      state.used.add(q.id);
      cells.push({ col, row, value, q, used: false, dd: false });
    });
  });
  saveUsed();
  const open = cells.filter(c => c.value >= 300);
  shuffle(open).slice(0, 2).forEach(c => c.dd = true);
  state.board = { cats: chosen, cells };
  state.turn = 0;
}

function currentTeam() { return state.teams[state.turn]; }

function bind() {
  document.getElementById('app').onclick = (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    act(btn.dataset.act, btn);
  };
}

function act(name, btn) {
  if (name === 'sound') {
    state.sound = !state.sound;
    localStorage.setItem('ss-sound', state.sound ? 'on' : 'off');
    render(); return;
  }
  if (name === 'privacy') { state.view = 'privacy'; render(); return; }
  if (name === 'donate') { state.view = 'donate'; render(); return; }
  if (name === 'home') { clearTimer(); state.view = 'home'; render(); return; }
  if (name === 'level') { state.level = btn.dataset.level === 'climb' ? 'climb' : Number(btn.dataset.level); render(); return; }
  if (name === 'pick') { state.mode = btn.dataset.mode; if (state.mode === 'study') { startStudy(); return; } state.view = 'setup'; state.teamCount = 2; render(); return; }
  if (name === 'count') { state.teamCount = Number(btn.dataset.n); captureNames(); render(); return; }
  if (name === 'start') { startMode(); return; }
  if (name === 'cell') { openCell(btn.dataset.id); return; }
  if (name === 'lock-wager') { lockWager(); return; }
  if (name === 'answer') { judge(Number(btn.dataset.i)); return; }
  if (name === 'open-steal') { state.view = 'steal'; render(); return; }
  if (name === 'steal-team') { beginSteal(Number(btn.dataset.i)); return; }
  if (name === 'continue') { afterClue(); return; }
  if (name === 'abandon') { clearTimer(); state.view = 'board'; render(); return; }
  if (name === 'reset-board') { buildBoard(); state.view = 'board'; render(); toast('New categories locked in.'); return; }
  if (name === 'call-final') { startFinal(); return; }
  if (name === 'final-wager') { saveFinalWager(); return; }
  if (name === 'final-pick') { saveFinalPick(Number(btn.dataset.i)); return; }
  if (name === 'winner') { state.view = 'winner'; render(); fanfare(); return; }
  if (name === 'study-answer') { studyAnswer(Number(btn.dataset.i)); return; }
  if (name === 'study-next') { nextStudy(); return; }
  if (name === 'study-refresh') { state.used.clear(); saveUsed(); toast('Library refreshed.'); nextStudy(); return; }
  if (name === 'streak-pick') { streakPick(Number(btn.dataset.i)); return; }
  if (name === 'streak-next') { streakNext(); return; }
  if (name === 'buzz') { buzz(Number(btn.dataset.i)); return; }
  if (name === 'buzz-answer') { buzzAnswer(Number(btn.dataset.i)); return; }
  if (name === 'buzz-next') { nextBuzz(); return; }
  if (name === 'end-mode') { clearTimer(); state.view = 'winner'; render(); return; }
  if (name === 'again') { startMode(); return; }
  if (name === 'recycle') { state.used.clear(); saveUsed(); toast('Bank recycled.'); render(); return; }
}

function captureNames() {
  document.querySelectorAll('[data-team]').forEach(input => {
    state.teams[Number(input.dataset.team)] = state.teams[Number(input.dataset.team)] || {};
    state.teams[Number(input.dataset.team)].name = input.value;
  });
}

function startMode() {
  captureNames();
  const previous = state.teams.slice();
  const n = state.teamCount || previous.length || 2;
  state.teams = Array.from({length: n}, (_, i) => ({
    name: (document.querySelector(`[data-team="${i}"]`) || {}).value || (previous[i] && previous[i].name) || NAMES[i],
    color: COLORS[i], score: 0, lives: 3, wager: 0, finalPick: ''
  }));
  localStorage.setItem('ss-teams', JSON.stringify(state.teams.map(t => t.name)));
  localStorage.setItem('ss-team-count', String(n));
  if (state.mode === 'board') { buildBoard(); state.view = 'board'; }
  if (state.mode === 'streak') startStreak();
  if (state.mode === 'buzzer') nextBuzz();
  render();
}

function openCell(id) {
  const cell = state.board.cells.find(c => c.q.id === id && !c.used);
  if (!cell) return;
  cell.used = true;
  const max = Math.max(currentTeam().score, 500);
  state.clue = { q: cell.q, value: cell.value, dd: cell.dd, order: shuffle(cell.q.choices), owner: state.turn, picked: null, correct: false, offerSteal: false, wager: cell.value, max };
  tone(440, .08);
  if (cell.dd) { state.view = 'wager'; render(); return; }
  state.view = 'clue'; render(); startClueTimer();
}
function lockWager() {
  const raw = Number(document.getElementById('wager').value || 0);
  state.clue.wager = Math.max(0, Math.min(state.clue.max, raw));
  state.view = 'clue'; render(); startClueTimer();
}
function judge(i) {
  if (state.lock || state.view !== 'clue') return;
  clearTimer();
  state.lock = true;
  const c = state.clue;
  c.picked = c.order[i];
  c.correct = c.picked === c.q.a;
  const pts = c.wager || c.value;
  if (c.correct) { currentTeam().score += pts; fanfare(); c.offerSteal = false; }
  else { if (c.dd) currentTeam().score -= pts; miss(); c.offerSteal = state.teams.length > 1 && !c.dd && !c.stolen; }
  state.view = 'resolve'; state.lock = false; render();
}
function beginSteal(i) {
  state.turn = i;
  state.clue.dd = false;
  state.clue.offerSteal = false;
  state.clue.stolen = true;
  state.clue.owner = i;
  state.clue.picked = null;
  state.clue.order = shuffle(state.clue.q.choices);
  state.view = 'clue';
  render();
  startClueTimer();
}
function afterClue() {
  if (!state.clue.correct) {
    if (state.clue.stolen && state.teams.length > 1) {
      const options = state.teams.map((_, i) => i).filter(i => i !== state.clue.owner);
      state.turn = options[Math.floor(Math.random() * options.length)];
    } else {
      state.turn = (state.clue.owner + 1) % state.teams.length;
    }
  }
  const left = state.board.cells.filter(c => !c.used).length;
  if (!left) { startFinal(); return; }
  state.view = 'board'; render();
}
function startFinal() {
  const q = pickQuestion(shuffle(CATS)[0], 4);
  state.used.add(q.id); saveUsed();
  state.final = { q, order: shuffle(q.choices), step: 0, phase: 'wager' };
  state.teams.forEach(t => { t.wager = 0; t.finalPick = ''; });
  state.view = 'final-wager'; render();
}
function saveFinalWager() {
  const t = state.teams[state.final.step];
  t.wager = Math.max(0, Math.min(t.score, Number(document.getElementById('wager').value || 0)));
  state.final.step += 1;
  if (state.final.step >= state.teams.length) { state.final.step = 0; state.view = 'final-answer'; }
  render();
}
function saveFinalPick(i) {
  const f = state.final;
  const t = state.teams[f.step];
  t.finalPick = f.order[i];
  f.step += 1;
  if (f.step >= state.teams.length) {
    state.teams.forEach(team => { team.score += team.finalPick === f.q.a ? team.wager : -team.wager; });
    state.view = 'final-reveal';
  }
  render();
}


function studyBand() {
  if (state.level === 'climb') return null;
  return Number(state.level);
}
function startStudy() {
  clearTimer();
  state.teams = [{ name: 'You', color: COLORS[0], score: 0, lives: 3, wager: 0, finalPick: '' }];
  state.study = { correct: 0, asked: 0, q: null, order: [], left: 20, lock: false, note: '' };
  nextStudy();
}
function nextStudy() {
  clearTimer();
  const band = studyBand();
  const fresh = BANK.filter(q => !state.used.has(q.id) && (band == null || q.d === band));
  if (!fresh.length) {
    state.study.q = null;
    state.study.order = [];
    state.study.lock = true;
    state.study.note = 'This band is empty. Refresh the library to bring the questions back.';
    state.view = 'study';
    render();
    return;
  }
  const q = fresh[Math.floor(Math.random() * fresh.length)];
  state.used.add(q.id);
  saveUsed();
  state.study.q = q;
  state.study.order = shuffle(q.choices.slice());
  state.study.left = 20;
  state.study.lock = false;
  state.study.note = '';
  state.view = 'study';
  render();
  state.timer = setInterval(() => {
    if (!state.study || state.study.lock) return;
    state.study.left -= 0.1;
    const bar = document.querySelector('.timer > i');
    const label = document.querySelector('[data-study-time]');
    if (bar) {
      bar.style.transform = `scaleX(${Math.max(0, state.study.left / 20)})`;
      bar.parentElement.classList.toggle('warn', state.study.left <= 5);
    }
    if (label) label.textContent = `${Math.max(0, Math.ceil(state.study.left))}s`;
    if (state.study.left <= 0) studyTimeout();
  }, 100);
}
function studyTimeout() {
  if (!state.study || state.study.lock) return;
  clearTimer();
  state.study.lock = true;
  state.study.asked += 1;
  state.study.note = 'Time. Answer: ' + state.study.q.a + '. ' + state.study.q.ref;
  miss();
  state.view = 'study';
  render();
}
function studyAnswer(i) {
  const S = state.study;
  if (!S || S.lock || !S.q) return;
  clearTimer();
  S.lock = true;
  S.asked += 1;
  const right = S.order[i] === S.q.a;
  if (right) {
    S.correct += 1;
    state.teams[0].score += 100;
    S.note = 'Correct. ' + S.q.ref;
    tone(700, .08);
  } else {
    S.note = 'Answer: ' + S.q.a + '. ' + S.q.ref;
    miss();
  }
  state.view = 'study';
  render();
}
function studyHTML() {
  const S = state.study || { correct: 0, asked: 0, q: null, order: [], left: 20, lock: true, note: '' };
  const band = studyBand();
  const bandLabel = band == null ? 'Full climb' : (LEVELS.find(l => l.id === band) || {}).label || ('Band ' + band);
  const header = `<div class="topbar">${brand()}<button class="ghost" data-act="home">Modes</button></div>`;
  const stats = `<p class="overlay-note">${esc(bandLabel)} · ${S.correct} right / ${S.asked} asked · score ${state.teams[0] ? state.teams[0].score : 0}</p>`;
  if (!S.q) {
    return `<div class="wrap stage">${header}${stats}<div class="clue"><div class="meta">Study</div><h2>${esc(S.note || 'No questions left in this band.')}</h2></div><div class="row-actions"><button class="primary" data-act="study-refresh">Refresh library</button><button class="ghost" data-act="home">Modes</button></div></div>`;
  }
  const choices = S.order.map((choice, i) => {
    let cls = 'choice';
    if (S.lock) {
      if (choice === S.q.a) cls += ' good';
      else if (S.note && S.note.startsWith('Answer') && choice !== S.q.a) cls += '';
    }
    return `<button class="${cls}" data-act="study-answer" data-i="${i}" ${S.lock ? 'disabled' : ''}>${i+1}. ${esc(choice)}</button>`;
  }).join('');
  const foot = S.lock
    ? `<p class="ref">${esc(S.note)}</p><div class="row-actions"><button class="primary" data-act="study-next">Next clue</button><button class="ghost" data-act="study-refresh">Refresh library</button></div>`
    : '';
  return `<div class="wrap stage">${header}<div class="timer"><i style="transform:scaleX(${Math.max(0, S.left/20)})"></i></div>${stats}<p class="overlay-note" data-study-time>${Math.ceil(S.left)}s</p><div class="clue"><div class="meta">${esc(S.q.cat)} · band ${S.q.d}</div><h2>${esc(S.q.q)}</h2></div><div class="choices">${choices}</div>${foot}</div>`;
}

function deal(diff) {
  const q = pickQuestion(shuffle(CATS)[0], diff || (state.level === 'climb' ? 1 + Math.floor(Math.random()*4) : state.level));
  state.used.add(q.id); saveUsed();
  return { q, order: shuffle(q.choices) };
}
function startStreak() {
  state.turn = 0;
  const dealt = deal(1);
  state.streak = { q: dealt.q, order: dealt.order, lock: false, note: '', clears: 0 };
  state.view = 'streak';
}
function streakPick(i) {
  const S = state.streak;
  if (S.lock) return;
  S.lock = true;
  const right = S.order[i] === S.q.a;
  if (right) {
    currentTeam().score += 100 * S.q.d;
    S.clears += 1;
    S.note = `Correct. ${S.q.ref}`;
    fanfare();
  } else {
    currentTeam().lives -= 1;
    S.note = `Miss. Answer: ${S.q.a}. ${S.q.ref}`;
    miss();
  }
  render();
  const alive = state.teams.filter(t => t.lives > 0);
  if (alive.length <= 1) setTimeout(() => { state.view = 'winner'; render(); fanfare(); }, 700);
}
function streakNext() {
  const aliveIdx = state.teams.map((t,i)=>t.lives>0?i:-1).filter(i=>i>=0);
  if (aliveIdx.length <= 1) { state.view = 'winner'; render(); return; }
  let next = (state.turn + 1) % state.teams.length;
  while (state.teams[next].lives <= 0) next = (next + 1) % state.teams.length;
  state.turn = next;
  const band = state.level === 'climb' ? Math.min(4, 1 + Math.floor(state.streak.clears / 2)) : state.level;
  const dealt = deal(band);
  state.streak = { q: dealt.q, order: dealt.order, lock: false, note: '', clears: state.streak.clears };
  render();
}
function nextBuzz() {
  const dealt = deal(state.level === 'climb' ? 1 + Math.floor(Math.random()*4) : state.level);
  state.buzzer = { q: dealt.q, order: dealt.order, buzzed: null, locked: new Set(), lock: false, note: '' };
  state.view = 'buzzer';
  render();
  startClueTimer();
}
function buzz(i) {
  if (state.buzzer.buzzed != null || state.buzzer.locked.has(i)) return;
  state.buzzer.buzzed = i;
  state.turn = i;
  tone(520, .07);
  render();
}
function buzzAnswer(i) {
  const B = state.buzzer;
  if (B.lock) return;
  B.lock = true;
  const right = B.order[i] === B.q.a;
  const pts = [100,200,300,400][B.q.d-1];
  if (right) {
    clearTimer();
    state.teams[B.buzzed].score += pts;
    B.note = `Locked in. ${B.q.ref}`;
    fanfare();
    render();
  } else {
    B.locked.add(B.buzzed);
    B.buzzed = null;
    B.lock = false;
    miss();
    if (B.locked.size >= state.teams.length) {
      clearTimer();
      B.note = `Answer: ${B.q.a}. ${B.q.ref}`;
    }
    render();
  }
}

window.addEventListener('keydown', (e) => {
  if (e.target.matches('input')) return;
  const buzzMap = { '1':0, z:1, v:2, m:3, '/':4, '=':5 };
  const buzzKey = e.key === '/' || e.key === '=' ? e.key : e.key.toLowerCase();
  if (state.view === 'buzzer' && state.buzzer && state.buzzer.buzzed == null && buzzMap[buzzKey] != null) {
    const btn = document.querySelector(`[data-act="buzz"][data-i="${buzzMap[buzzKey]}"]`);
    if (btn && !btn.disabled) btn.click();
    return;
  }
  const n = Number(e.key);
  if (n >= 1 && n <= 4) {
    const btn = document.querySelector(`[data-act="answer"][data-i="${n-1}"], [data-act="zap"][data-i="${n-1}"], [data-act="streak-pick"][data-i="${n-1}"], [data-act="buzz-answer"][data-i="${n-1}"]`);
    if (btn && !btn.disabled) btn.click();
  }
});

render();
</script>
</body>
</html>
